name: "测测去广告"
description: "移除开屏广告、活动皮肤、各类弹窗及横幅、金刚位红点文字，精简首页标签及搜索页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Cece.png"
mitm:
  hostnames:
    - "api.cece.com"
http:
  rewrite:
    - "/^https:\\/\\/api\\.cece\\.com\\/user\\/index\\/banners\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/ask\\/ai_chat\\/popup\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/user\\/popup\\//i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/chart\\/easter_egg\\/popup\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/user\\/register_task\\/notice_task\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/ask\\/ask\\/alert_minus\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/msgAsk\\/question\\/new_coupon_status\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/user\\/user\\/myPageBanner\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/live\\/recommend\\/new_user\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/chart\\/tools\\/get_search_recommend\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/user\\/rank\\/list\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.cece\\.com\\/chart\\/config\\/chart_activity\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.cece\\.com\\/user\\/init\\?"
      filter: "delpaths([[\"data\", \"launch_img_url\"], [\"data\", \"launch_goto_url\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.cece\\.com\\/common\\/app\\/app_config\\?"
      filter: "setpath([\"data\", \"is_new_year\"]; false) | setpath([\"data\", \"spring_festival\"]; false) | setpath([\"data\", \"show_feedback_entry\"]; false) | setpath([\"data\", \"show_course_entry\"]; false) | setpath([\"data\", \"show_store_entry\"]; false) | setpath([\"data\", \"show_luna\"]; false) | setpath([\"data\", \"show_ead\"]; false) | setpath([\"data\", \"show_ad\"]; false) | setpath([\"data\", \"show_live_filter_tarot\"]; false) | setpath([\"data\", \"community_feed_adswitch\"]; false) | setpath([\"data\", \"open_screen_ad_times\"]; 0) | setpath([\"data\", \"open_screen_ad_duration\"]; 0) | setpath([\"data\", \"isShowThumbsGif\"]; false) | setpath([\"data\", \"teenager_mode_open\"]; false) | setpath([\"data\", \"flu_log\"]; false)"
  - response_jq:
      match: "^https:\\/\\/api\\.cece\\.com\\/common\\/app\\/app_config\\?"
      filter: "delpaths([[\"data\", \"activity_list\"], [\"data\", \"fortune_ab_config\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.cece\\.com\\/chart\\/tools\\/home_10_tools\\?"
      filter: ".data.tools |= map(del(.icon_tip_image))"
  - response_jq:
      match: "^https:\\/\\/api\\.cece\\.com\\/user\\/index\\/tab_list\\?"
      filter: ".data.tabs |= map(select(.type != \"shop\"))"
  - response_jq:
      match: "^https:\\/\\/api\\.cece\\.com\\/common\\/app\\/risk_entrance\\?"
      filter: "setpath([\"data\", \"ai_fortune_show_ask_tool\"]; false) | setpath([\"data\", \"ai_sign_show_ask_tool\"]; false) | setpath([\"data\", \"single_tool_show_dice_card\"]; false) | setpath([\"data\", \"single_tool_show_tarot_card\"]; false) | setpath([\"data\", \"single_tool_show_bazi_card\"]; false) | setpath([\"data\", \"single_tool_show_hepan_card\"]; false) | setpath([\"data\", \"single_tool_show_ziwei_card\"]; false) | setpath([\"data\", \"single_tool_show_xingpan_card\"]; false) | setpath([\"data\", \"multi_tool_show_card\"]; false) | setpath([\"data\", \"ai_ccai_show_multi_tool\"]; false)"
