      name: "清洗配置"
      match: "^https:\\/\\/api\\.chelaile\\.net\\.cn\\/bus-side\\/appToggle\\/getStatus\\?"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/cdn\\.web\\.chelaile\\.net\\.cn\\/info-flow\\/index\\.html\\?/i":
        reject: true
    - "/^https:\\/\\/image3\\.chelaile\\.net\\.cn\\/hw6u6LYY\\.png$/i":
        reject-img: true
