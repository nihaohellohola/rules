name: "金山文档去广告"
description: "移除首页横幅推广、表单收集页面推广和我的页面推广。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/WPS_Documents.png"
mitm:
  hostnames:
    - "www.kdocs.cn"
    - "f-api.kdocs.cn"
http:
  rewrite:
    - "/^https:\\/\\/www\\.kdocs\\.cn\\/kdg\\/api\\/v1\\/cards\\/type\\/3\\?iosVer=\\d+\\.\\d+\\.\\d+&isGetList=1/i":
        reject-dict: true
    - "/^https:\\/\\/www\\.kdocs\\.cn\\/kdg\\/api\\/v1\\/cards\\/type\\/27\\?iosVer=\\d+\\.\\d+\\.\\d+&isGetList=1/i":
        reject-dict: true
    - "/^https:\\/\\/f-api\\.kdocs\\.cn\\/godfather\\/api\\/thirdparty\\/v1\\/viewpager\\?showLocal=mobileWebIndex/i":
        reject-dict: true
