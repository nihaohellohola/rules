name: "百度网盘去广告"
description: "移除开屏广告、首页卡片广告、传输页面广告、各类弹窗，精简侧拉抽屉和我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BaiduNetDisk.png"
mitm:
  hostnames:
    - "pan.baidu.com"
http:
  rewrite:
    - "/^https:\\/\\/pan\\.baidu\\.com\\/api\\/getconfig\\?/i":
        reject-dict: true
    - "/^https:\\/\\/pan\\.baidu\\.com\\/api\\/getsyscfg\\?/i":
        reject-dict: true
    - "/^https:\\/\\/pan\\.baidu\\.com\\/api\\/taskscore\\/tasklist\\?/i":
        reject-dict: true
    - "/^https:\\/\\/pan\\.baidu\\.com\\/act\\/api\\/activityentry\\?/i":
        reject-dict: true
    - "/^https:\\/\\/pan\\.baidu\\.com\\/rest\\/\\d\\.\\d\\/pcs\\/adv\\?/i":
        reject-dict: true
    - "/^https:\\/\\/pan\\.baidu\\.com\\/api\\/plugin\\/get\\?/i":
        reject-dict: true
    - "/^https:\\/\\/pan\\.baidu\\.com\\/recommend\\/query\\/list\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/pan\\.baidu\\.com\\/feed\\/kingkongdistrict\\?"
      filter: ".data.data |= map(select(.type != \"novel\" and .type != \"shortplay\" and .type != \"print\" and .type != \"job_hunt\"))"
