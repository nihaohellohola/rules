name: "YouTube去广告"
description: "移除YouTube视频、瀑布流、搜索和Shorts中的广告，移除底栏的Shorts按钮和上传按钮，增加画中画及字幕翻译功能。移除YouTube Music底栏的上传、选段和升级按钮，增加歌词翻译，支持二者的后台播放。此插件需要启用MitM over HTTP/2和QUIC回退保护。支持Premium订阅用户使用，不支持tvOS设备。"
author: "Maasea[https://github.com/Maasea], VirgilClyne[https://github.com/VirgilClyne], Choler[https://github.com/Choler], DivineEngine[https://github.com/DivineEngine], app2smile[https://github.com/app2smile]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YouTube.png"
mitm:
  hostnames:
    - "*.googlevideo.com"
    - "youtubei.googleapis.com"
scriptings:
  - http_response:
      name: "YouTube去广告"
      match: "^https:\\/\\/youtubei\\.googleapis\\.com\\/(youtubei\\/v1\\/(browse|next|player|search|reel\\/reel_watch_sequence|guide|account\\/get_setting|get_watch|log_event|config))(\\?(.*))?$"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/YouTube/YouTube_remove_ads/YouTube_remove_ads_response.js"
      body_required: true
      binary_body: true
      arguments:
        "_compat.$argument": "blockUpload=false&blockShorts=false&blockImmersive=false&captionLang=zh-Hans&debug=false"
  - http_request:
      name: "请求初始化"
      match: "^https?:\\/\\/[\\w-]+\\.googlevideo\\.com\\/initplayback.+&ack.*"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/YouTube/YouTube_remove_ads/YouTube_remove_ads_request.js"
      body_required: true
      binary_body: true
      arguments:
        "_compat.$argument": "captionLang=zh-Hans"
  - http_request:
      name: "请求日志事件"
      match: "^https:\\/\\/youtubei\\.googleapis\\.com\\/youtubei\\/v1\\/log_event"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/YouTube/YouTube_remove_ads/YouTube_remove_ads_request.js"
      body_required: true
      binary_body: true
      arguments:
        "_compat.$argument": "blockUpload=false&blockShorts=false&blockImmersive=false&captionLang=zh-Hans&debug=false"
