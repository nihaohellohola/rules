name: "京东比价"
description: "首次使用需安装慢慢买应用，之后点击进入[我的]页面以捕获Cookie，捕获成功后方可在商品详情页面查看比价内容。"
author: "wf021325[https://github.com/wf021325], githubdulong[https://github.com/githubdulong], mw418[https://github.com/mw418]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png"
mitm:
  hostnames:
    - "in.m.jd.com"
    - "apapia-sqk-weblogic.manmanbuy.com"
scriptings:
  - http_request:
      name: "捕获令牌"
      match: "/^https?:\\/\\/apapia-sqk-weblogic\\.manmanbuy\\.com\\/baoliao\\/center\\/menu$/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/JD/JD_Price.js"
      body_required: true
  - http_response:
      name: "京东比价"
      match: "/^https?:\\/\\/in\\.m\\.jd\\.com\\/product\\/graphext\\/\\d+\\.html/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/JD/JD_Price.js"
      body_required: true
