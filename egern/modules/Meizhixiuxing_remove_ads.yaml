name: "美丽修行去广告"
description: "移除开屏广告、首页广告、发现页广告、美修盒页面广告、下拉广告、弹窗广告、搜索推广、版本更新弹窗及我的页面广告。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Meizhixiuxing.png"
mitm:
  hostnames:
    - "api.bevol.com"
http:
  rewrite:
    - "/^https:\\/\\/api\\.bevol\\.com\\/appmain\\/app\\/home\\/launch$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.bevol\\.com\\/appmain\\/app\\/home\\/popup$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.bevol\\.com\\/personal\\/page$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.bevol\\.com\\/seach\\/foundAndTopSearch$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.bevol\\.com\\/appmain\\/app\\/home\\/page$"
      filter: "delpaths([[\"result\", \"versionPopUp\"], [\"result\", \"isShowSearchLabel\"], [\"result\", \"isShowSearchFeedBack\"], [\"result\", \"centerBannerAdvert\"], [\"result\", \"programmaticAdvertising\"], [\"result\", \"mattsData\"], [\"result\", \"questionnaireMap\"], [\"result\", \"appPullDownAdvert\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.bevol\\.com\\/appmain\\/app\\/home\\/feed$"
      filter: "delpaths([[\"result\", \"banners\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.bevol\\.com\\/appmain\\/app\\/home\\/feed$"
      filter: ". | .result.returnList |= (map(select(.tname == \"userPart\"))) | .result.returnList |= map(select(. | has(\"adId\") | not))"
  - response_jq:
      match: "^https:\\/\\/api\\.bevol\\.com\\/trialbox\\/shop\\/app\\/homePage$"
      filter: "delpaths([[\"result\", \"firstPersonActivity\"], [\"result\", \"mainActivity\"], [\"result\", \"brandZone\"], [\"result\", \"imageAD2\"], [\"result\", \"couponPopupInfo\"]])"
