name: "沃尔玛去广告"
description: "移除操作引导、商品详情页用户调研、搜索填充词和搜索发现，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Walmart.png"
mitm:
  hostnames:
    - "api-hyper.walmartmobile.cn"
http:
  rewrite:
    - "/^https:\\/\\/api-hyper\\.walmartmobile\\.cn\\/search\\/ad\\//i":
        reject-dict: true
    - "/^https:\\/\\/api-hyper\\.walmartmobile\\.cn\\/cms-web\\/frontapi\\/shadedWords\\/list\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api-hyper\\.walmartmobile\\.cn\\/search\\/frontapi\\/discovery-words\\/list$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api-hyper\\.walmartmobile\\.cn\\/cms-web\\/frontapi\\/common\\/page\\/get\\?.*&type=26$"
      filter: ".data |= (.moduleList | map(select(.templateCode == \"nav-bar-title\" or .templateCode == \"member-info\" or .templateCode == \"distribution-center\" or .templateCode == \"wallet\" or .templateCode == \"swiper\" or .templateCode == \"my-order\")))"
