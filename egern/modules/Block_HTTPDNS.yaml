name: "HTTPDNS拦截器"
description: "此插件是所有去广告插件的依赖，拦截常见的HTTPDNS服务，以确保这些请求都能够在Loon的DNS框架下工作。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], VirgilClyne[https://github.com/VirgilClyne]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/Other_icon/120px/HTTPDNS.png"
mitm:
  hostnames:
    - "appconf.mail.163.com"
    - "msglb.91160.com"
    - "ucdc2-upaas.uc.cn"
    - "gw-cn.jiaoliuqu.com"
http:
  rewrite:
    - "/^https?:\\/\\/appconf\\.mail\\.163\\.com\\/mailmaster\\/api\\/http\\/urlConfig\\.do$/i":
        reject-dict: true
    - "/^https?:\\/\\/cdn\\.wup\\.huya\\.com\\/monitor\\/monitor\\.jsp/i":
        reject: true
    - "/^https:\\/\\/msglb\\.91160\\.com\\/msg\\/outer\\/broker\\/get$/i":
        reject-dict: true
    - "/^https:\\/\\/gslbali\\.ximalaya\\.com\\/linkeye-cloud\\/httpdns\\//i":
        reject: true
    - "/^https:\\/\\/ucdc\\d?-upaas\\.uc\\.cn\\/api\\/v\\d\\/dns_query\\?/i":
        reject-dict: true
    - "/^https:\\/\\/gw-cn\\.jiaoliuqu\\.com\\/taqu-im-broadcast-srv\\/v\\d\\/Comet\\/get\\?/i":
        reject-dict: true
