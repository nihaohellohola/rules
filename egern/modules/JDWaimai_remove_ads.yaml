name: "京东外卖去广告"
description: "移除首页推广、点评页面非美食内容、购物车及我的页面推荐、搜索发现、搜索榜单，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JDWaimai.png"
mitm:
  hostnames:
    - "color.jddj.com"
    - "api.m.jd.com"
http:
  rewrite:
    - "/^https:\\/\\/color\\.jddj\\.com\\/client\\.action\\?functionId=uniformRecommend/i":
        reject-dict: true
    - "/^https:\\/\\/color\\.jddj\\.com\\/client\\.action\\?functionId=search_recommendRanking$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/color\\.jddj\\.com\\/client\\.action\\?functionId=hours_home$"
      filter: "del(.result.config.searchFloor.data[].searchWords) | .result.data |= map(if .tnConfigVO?.businessCode == \"nearby_HourlyGo_Operation_Tags\" then empty else . end)"
  - response_jq:
      match: "^https:\\/\\/color\\.jddj\\.com\\/client\\.action\\?functionId=wmHome$"
      filter: "(.floors |= map(del(.data.tnData.newsInfo?))) | .floors |= (map(select(.mId != \"newWalletIdFloor\" and .mId != \"recommendfloor\"))) | .floors |= (map(.data |= (if .tnData? then del(.tnData.cardList, .tnData.cardListStatic, .tnData.walletList) else . end)))"
  - response_jq:
      match: "^https:\\/\\/api\\.m\\.jd\\.com\\/client\\.action$"
      filter: "delpaths([[\"data\", \"searchDTO\", \"searchWords\"], [\"data\", \"wishlistDTO\", \"bubbleTip\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.m\\.jd\\.com\\/client\\.action$"
      filter: ".data.tabList |= (map(select(.code == \"recommendation\" or .code == \"find_food\")) | map(if .code == \"recommendation\" then .dpHomeFeedTabResultDTOList = .dpHomeFeedTabResultDTOList[0:2] else . end | .dpHomeBannerResultDTOList = []))"
