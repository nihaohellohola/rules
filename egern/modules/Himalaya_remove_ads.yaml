name: "喜马拉雅去广告"
description: "移除开屏广告、播放器广告、各类推荐内容，精简频道和我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Himalaya.png"
mitm:
  hostnames:
    - "gslbali.ximalaya.com"
    - "search.ximalaya.com"
    - "searchwsa.ximalaya.com"
    - "mobile.ximalaya.com"
    - "mobilehera.ximalaya.com"
    - "mobwsa.ximalaya.com"
    - "m.ximalaya.com"
    - "mwsa.ximalaya.com"
http:
  rewrite:
    - "/^https:\\/\\/(search|searchwsa)\\.ximalaya\\.com\\/hub\\/(guideWord|hotWord)V\\d\\//i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/discovery-feed\\/v\\d\\/scene\\/listen\\/refresh\\?/i":
        reject-dict: true
    - "/^https:\\/\\/(m|mwsa)\\.ximalaya\\.com\\/x-web-activity\\/signIn\\/getHomePageSignInInfo\\//i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/subscribe\\/v\\d\\/subscribe\\/tagAlbumList$/i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/track-feed\\/v\\d\\/chase\\/recommend\\//i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/social-web\\/follow-stream\\/category\\/\\d+$/i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/mobile-playpage\\/playpage\\/recommendContentV\\d\\//i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/mobile-playpage\\/playpage\\/recommend\\/resource\\/allocation\\//i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/firework-portal\\/v\\d+\\/sync\\?/i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/business-sale-promotion-guide-mobile-web\\/popup\\//i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/app-skin-service\\/skin\\/setting\\/info\\//i":
        reject-dict: true
    - "/^https:\\/\\/(live|livewsa)\\.ximalaya\\.com\\/lamia\\/v1\\/subscribe\\/status$/i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/subscribe\\/v\\d\\/subscribe\\/recommend\\?/i":
        reject-dict: true
    - "/^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/mobile-user\\/v\\d\\/purchased\\/recommend\\//i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/discovery-feed\\/v\\d\\/mix\\/"
      filter: ".heData |= map(select(.item.list[].bizType != \"SceneListenCard\"))"
  - response_jq:
      match: "^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/discovery-category\\/customCategories\\/"
      filter: ".categoryList |= map(.itemList |= map(select(.title | test(\"直播|123狂欢节|SVIP\"; \"i\") | not))) | .customCategoryList |= map(select(.title | test(\"直播|123狂欢节|SVIP\"; \"i\") | not))"
  - response_jq:
      match: "^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/football-portal\\/diff2\\/batch\\?"
      filter: "delpaths([[\"json\", \"ad\"], [\"json\", \"toc\"]])"
  - response_jq:
      match: "^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/nexus-web\\/v\\d\\/tabs\\/customTabs\\?"
      filter: ".data.feedTabs |= map(select(.name != \"大赛\"))"
  - response_jq:
      match: "^https:\\/\\/mobwsa\\.ximalaya\\.com\\/mobile-playpage\\/playpage\\/tabs\\/v2\\/"
      filter: "delpaths([[\"data\", \"playpage\", \"resourceMap\", \"defaultResource\"], [\"data\", \"playpage\", \"resourceMap\", \"playPageTip\"]])"
  - response_jq:
      match: "^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/mobile-user\\/v\\d\\/homePage\\/"
      filter: "delpaths([[\"data\", \"freeListenV2\"]])"
  - response_jq:
      match: "^https:\\/\\/(mobile|mobilehera|mobwsa)\\.ximalaya\\.com\\/mobile-user\\/v\\d\\/homePage\\/"
      filter: ".data.serviceModule.entrances |= map(select(.name == \"全部服务\"))"
