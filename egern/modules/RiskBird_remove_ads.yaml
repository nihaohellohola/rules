name: "风鸟去广告"
description: "移除首页信息流和轮播图"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/RiskBird.png"
mitm:
  hostnames:
    - "m.riskbird.com"
scriptings:
  - http_response:
      name: "移除推荐老板"
      match: "/^https:\\/\\/m\\.riskbird\\.com\\/prod-qbb-api\\/query\\/person\\/personRecommend/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RiskBird/RiskBird_remove_ads.js"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/m\\.riskbird\\.com\\/prod-qbb-api\\/user\\/getBannerList/i":
        reject-dict: true
    - "/^https:\\/\\/m\\.riskbird\\.com\\/prod-qbb-api\\/searchHotEnt/i":
        reject-dict: true
