      policy: REJECT
  - domain_suffix:
      match: "iyes.youku.com"
      policy: REJECT
  - domain:
      match: "adsmind.ugdtimg.com"
      policy: REJECT
  - domain:
      match: "pre-acs.youku.com"
      policy: REJECT
  - domain:
      match: "youku-acs.m.taobao.com"
      policy: REJECT
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/un-acs\\.youku\\.com\\/gw\\/mtop\\.youku\\.play\\.ups\\.appinfo\\.get"
      filter: "delpaths([[\"data\", \"data\", \"ad\"], [\"data\", \"data\", \"watermark\"], [\"data\", \"data\", \"ykad\"]])"
  - response_jq:
      match: "^https:\\/\\/push\\.m\\.youku\\.com\\/collect-api\\/get_push_interval_config_wx\\?"
      filter: "delpaths([[\"data\", \"tipContent\"], [\"data\", \"tipContentNew\"]])"
