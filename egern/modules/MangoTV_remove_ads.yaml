name: "芒果TV去广告"
description: "移除开屏广告、信息流广告、播放页广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], RuCu6[https://github.com/RuCu6]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Mango_TV.png"
mitm:
  hostnames:
    - "dc?.bz.mgtv.com"
    - "mobileso.bz.mgtv.com"
    - "damang.api.mgtv.com"
    - "hb-boom.api.mgtv.com"
    - "mobile.api.mgtv.com"
    - "mobile.api.hunantv.com"
    - "me.bz.mgtv.com"
    - "mobile-thor.api.mgtv.com"
http:
  rewrite:
    - "/^https:\\/\\/dc\\.bz\\.mgtv\\.com\\/dynamic\\/v\\d\\/skin\\/config\\?/i":
        reject-dict: true
    - "/^https:\\/\\/dc\\.bz\\.mgtv\\.com\\/dynamic\\/v\\d\\/channel\\/ads\\?/i":
        reject-dict: true
    - "/^http:\\/\\/mobileso\\.bz\\.mgtv\\.com\\/spotlight\\/search\\/v\\d\\?/i":
        reject-dict: true
    - "/^https:\\/\\/damang\\.api\\.mgtv\\.com\\/station\\/album\\/red\\/dot\\?/i":
        reject-dict: true
    - "/^https:\\/\\/hb-boom\\.api\\.mgtv\\.com\\/release\\/pullReleaseInfo$/i":
        reject-dict: true
    - "/^https:\\/\\/mobile\\.api\\.mgtv\\.com\\/v\\d\\/mobile\\/checkUpdate\\?/i":
        reject-dict: true
    - "/^https?:\\/\\/mobileso\\.bz\\.mgtv\\.com\\/mobile\\/recommend\\/v\\d\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https?:\\/\\/mobile\\.api\\.(mgtv|hunantv)\\.com\\/mobile\\/config\\?"
      filter: "setpath([\"data\", \"dc_adConfig\"]; 0) | setpath([\"data\", \"XmsellSwitch\"]; 0) | setpath([\"data\", \"screenshot_share_switch\"]; 0) | setpath([\"data\", \"playerUseHttpDNS\"]; 0) | setpath([\"data\", \"damang_tab\"]; 0) | setpath([\"data\", \"relative_ads\"]; 0) | setpath([\"data\", \"second_floor_guide_switch\"]; 0) | setpath([\"data\", \"progress_bar_ad_switch\"]; 0) | setpath([\"data\", \"XmVideoB\"]; 0) | setpath([\"data\", \"damang_duanju_tab\"]; 0) | setpath([\"data\", \"playview_box_ad_switch\"]; 0) | setpath([\"data\", \"topBarSwitch\"]; 0) | setpath([\"data\", \"VIPSDKB2\"]; 0)"
  - response_jq:
      match: "^https:\\/\\/me\\.bz\\.mgtv\\.com\\/v3\\/module\\/list\\?"
      filter: ".data.list |= map(select(.id | IN(1, 2, 4, 7))) | .data.list |= map(if .moduleType == 2 then .data |= map(select(.moduleType == 11)) elif .moduleType == 4 then .data |= map(select(.moduleType == 14 or .moduleType == 23)) elif .moduleType == 7 then .data |= map(select(.moduleType == 16 and .title != \"音乐广场\")) else . end)"
  - response_jq:
      match: "^https:\\/\\/me\\.bz\\.mgtv\\.com\\/v4\\/module\\/list\\?"
      filter: ".data.list |= (map(select(.id != 3 and .id != 7))|map(if .id==2 then .data|=map(select(.id!=65))elif .id==4 then .data|=map(select(.title!=\"追更banner\" and .id!=57))elif .id==5 then .data|=(map(select(.id==9 or .id==13))|map(if .id==9 then .list|=map(select(.id==20 or .id==60 or .id==18)) else . end))elif .id==6 then .data|=map(select(.id==15)) else . end))"
  - response_jq:
      match: "^https?:\\/\\/dc\\d?\\.bz\\.mgtv\\.com\\/dynamic\\/v\\d\\/channel\\/index\\/\\w"
      filter: "delpaths([[\"adInfo\"]])"
  - response_jq:
      match: "^https?:\\/\\/dc\\d?\\.bz\\.mgtv\\.com\\/dynamic\\/v\\d\\/channel\\/index\\/\\w"
      filter: ".data |= map(select(.moduleEntityId != \"10579\" and .moduleEntityId != \"9686\")) | .moduleIDS |= map(select(.moduleEntityId != \"10579\" and .moduleEntityId != \"9686\"))"
  - response_jq:
      match: "^https:\\/\\/mobile-thor\\.api\\.mgtv\\.com\\/v\\d+\\/vod\\/info\\?"
      filter: "delpaths([[\"data\", \"config\", \"ad\"], [\"data\", \"config\", \"vipNav\"], [\"data\", \"template\", \"skinList\"], [\"data\", \"template\", \"theme\"]])"
  - response_jq:
      match: "^https:\\/\\/mobile-thor\\.api\\.mgtv\\.com\\/v\\d+\\/vod\\/info\\?"
      filter: ".data.tabs |= map(select(.name == \"视频\" or .name == \"讨论\")) | .data.template.modules |= map(if .clipInfo.ext?.ipPublishEntrance then .clipInfo |= del(.ext) else . end) | .data.template.modules |= map(select(.dataType == 101 or .dataType == 201)) | .data.template.modules |= map(.media.list |= (if type == \"array\" then map(select(.type != 0)) else . end))"
  - response_jq:
      match: "^https:\\/\\/comment\\.mgtv\\.com\\/v\\d\\/comment\\/getCommentList\\?"
      filter: ".data.list |= map(select(.type == 0))"
