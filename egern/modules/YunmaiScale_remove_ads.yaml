name: "好轻去广告"
description: "移除开屏广告、弹窗广告、横幅推广、商品推广，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YunmaiScale.png"
mitm:
  hostnames:
    - "yunmai.sfo-tx-beijing-02.saas.sensorsdata.cn"
    - "apisvr.iyunmai.com"
    - "restapi.iyunmai.com"
http:
  rewrite:
    - "/^https:\\/\\/yunmai\\.sfo-tx-beijing-02\\.saas\\.sensorsdata\\.cn\\/api\\/v2\\/sfo\\/user_popup_configs\\?/i":
        reject-dict: true
    - "/^https:\\/\\/restapi\\.iyunmai\\.com\\/ad-api\\//i":
        reject-dict: true
    - "/^https:\\/\\/apisvr\\.iyunmai\\.com\\/api\\/ios\\/first-page-module\\/center_menu\\.json\\?/i":
        reject-dict: true
    - "/^https:\\/\\/restapi\\.iyunmai\\.com\\/api\\/ios\\/ad\\//i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/apisvr\\.iyunmai\\.com\\/api\\/ios\\/apps\\/get-online-parameter-list\\.json\\?"
      filter: ".data.rows |= map(select(.name | IN(\"AC_startTime\",\"AC_endTime\",\"AC_enable\",\"AC_url\",\"AC_challenge_tip\",\"AC_challenge_tip_id\",\"AC_pt_tip\",\"AC_pt_tip_id\",\"AC_pt_go_tmall_jd\",\"month7_activity\",\"AC_xmas_isOpen\",\"home_show_info\",\"new_user_credit_exchange_info\",\"AC_share_recommendUrl\",\"AC_share_recommendUrl_2\",\"AC_share_recommendUrl_3\") | not))"
