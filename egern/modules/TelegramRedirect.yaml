name: "Telegram重定向"
description: "适用于安装了多个不同Telegram客户端的用户，用于在指定客户端中打开公开或私有群组及频道的Telegram短链。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Telegram.png"
mitm:
  hostnames:
    - "t.me"
http:
  rewrite:
    - "/^https:\\/\\/t\\.me\\/([A-Za-z][A-Za-z0-9_]{3,30}[A-Za-z0-9])\\/?$/ as item":
        redirect: "307, \"${app}://resolve?domain=${item.1}"
    - "/^https:\\/\\/t\\.me\\/\\+([A-Za-z0-9_-]+)\\/?$/ as item":
        redirect: "307, \"${app}://join?invite=${item.1}"
