name: "1.1.1.1配置管理"
description: "提取1.1.1.1应用的配置并生成Loon可用的节点配置，点击下面署名前往配置1.1.1.1的BoxJs配置。"
author: "VirgilClyne[https://github.com/VirgilClyne], I-am-R-E[https://github.com/I-am-R-E]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/1.1.1.1.png"
mitm:
  hostnames:
    - "api.cloudflareclient.com"
    - "zero-trust-client.cloudflareclient.com"
scriptings:
  - http_request:
      name: "WARP Personal Request"
      match: "/^https?:\\/\\/(api|zero-trust-client)\\.cloudflareclient\\.com\\/(.*)\\/reg\\/[0-9a-f]{8}-[0-9a-f]{4}-[0-5][0-9a-f]{3}-[089ab][0-9a-f]{3}-[0-9a-f]{12}$/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/VirgilClyne/Cloudflare/main/js/1.1.1.1.request.js"
      body_required: true
  - http_response:
      name: "WARP Personal Response"
      match: "/^https?:\\/\\/(api|zero-trust-client)\\.cloudflareclient\\.com\\/(.*)\\/reg\\/[0-9a-f]{8}-[0-9a-f]{4}-[0-5][0-9a-f]{3}-[089ab][0-9a-f]{3}-[0-9a-f]{12}$/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/VirgilClyne/Cloudflare/main/js/1.1.1.1.response.js"
      body_required: true
  - http_request:
      name: "WARP Teams Request"
      match: "/^https?:\\/\\/(api|zero-trust-client)\\.cloudflareclient\\.com\\/(.*)\\/reg\\/t\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-5][0-9a-f]{3}-[089ab][0-9a-f]{3}-[0-9a-f]{12}$/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/VirgilClyne/Cloudflare/main/js/1.1.1.1.request.js"
      body_required: true
  - http_response:
      name: "WARP Teams Response"
      match: "/^https?:\\/\\/(api|zero-trust-client)\\.cloudflareclient\\.com\\/(.*)\\/reg\\/t\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-5][0-9a-f]{3}-[089ab][0-9a-f]{3}-[0-9a-f]{12}$/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/VirgilClyne/Cloudflare/main/js/1.1.1.1.response.js"
      body_required: true
