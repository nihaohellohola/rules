name: "阿里云盘去广告"
description: "移除首页广告横幅、弹窗和顶部奖励。"
author: "RuCu6[https://github.com/RuCu6]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/AliYunDrive.png"
mitm:
  hostnames:
    - "api.alipan.com"
    - "member.alipan.com"
    - "bizapi.alipan.com"
scriptings:
  - http_response:
      name: "移除阿里云盘广告"
      match: "/^https:\\/\\/(biz)?api\\.alipan\\.com\\/apps\\/v\\d\\/users?\\/home\\/(news|widgets)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/AliYunDrive/AliYunDrive_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除阿里云盘广告"
      match: "/^https:\\/\\/member\\.alipan\\.com\\/v1\\/users\\/onboard_list/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/AliYunDrive/AliYunDrive_remove_ads.js"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/member\\.alipan\\.com\\/v2\\/activity\\/sign_in_luckyBottle/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.alipan\\.com\\/adrive\\/v1\\/file\\/getTopFolders/i":
        reject-dict: true
