name: "猫耳FM去广告"
description: "移除开屏广告、青少年模式弹窗、首页顶部入口，替换底栏的直播入口为发现入口。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CatEarFM.png"
mitm:
  hostnames:
    - "app.missevan.com"
    - "data.missevan.com"
    - "fm.missevan.com"
http:
  rewrite:
    - "/^https:\\/\\/data\\.missevan\\.com\\/site\\/ad-track$/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.missevan\\.com\\/x\\/recommend\\/get-popup$/i":
        reject-dict: true
    - "/^https:\\/\\/fm\\.missevan\\.com\\/api\\/v2\\/meta\\/banner$/i":
        reject-dict: true
    - "/^https:\\/\\/fm\\.missevan\\.com\\/api\\/v2\\/recommended\\/top\\?/i":
        reject-dict: true
    - "/^https:\\/\\/fm\\.missevan\\.com\\/api\\/v2\\/chatroom\\/sound\\/recommend\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/site\\/launch\\?"
      filter: "delpaths([[\"info\", \"splash\"], [\"info\", \"splash_ready\"]])"
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/site\\/config$"
      filter: "delpaths([[\"info\", \"tab_bar_live\"], [0], [\"info\", \"enable_tab_bar_live_notice\"], [\"false\"], [\"info\", \"teenager_popup_mode\"], [0]])"
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/site\\/config$"
      filter: "delpaths([[\"info\", \"httpdns\"], [\"info\", \"homepage_top_task_button\"]])"
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/site\\/config$"
      filter: ".info.cronet |= (fromjson | .quic=false | tojson)"
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/site\\/tabs\\?"
      filter: ".info.tabs |= map(select(.title as $t | [\"直播\", \"发现\", \"广播剧\", \"听书\", \"分类\"] | index($t) != null))"
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/site\\/icons\\?"
      filter: ".info.icons |= map(select(.title as $t | $t == \"直播\" or $t == \"必听剧\" or $t == \"免费榜\" or $t == \"夜猫子\" or $t == \"启动音\"))"
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/discovery\\/list$"
      filter: ".info |= map(map(select(.title != \"免流服务\")))"
  - response_jq:
      match: "^https:\\/\\/app\\.missevan\\.com\\/site\\/get-top$"
      filter: "delpaths([[\"info\", \"search_words\"]])"
