name: "ZAKER去广告"
description: "移除开屏广告、置顶轮播图广告和文末广告。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZAKER.png"
mitm:
  hostnames:
    - "iphone.myzaker.com"
    - "ggs.myzaker.com"
http:
  rewrite:
    - "/^https:\\/\\/iphone\\.myzaker\\.com\\/zaker\\/cover\\.php\\?/i":
        reject-dict: true
    - "/^https:\\/\\/iphone\\.myzaker\\.com\\/zaker\\/block_top_ad\\.php\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/iphone\\.myzaker\\.com\\/zaker\\/article_mongo_sec\\.php\\?"
      filter: "delpaths([[\"data\", \"ad_url\"]])"
  - response_jq:
      match: "^https:\\/\\/ggs\\.myzaker\\.com\\/zk_article_ad\\.php\\?"
      filter: "delpaths([[\"data\", \"article_bottom\"], [\"data\", \"recommend_ad\"]])"
  - response_jq:
      match: "^https:\\/\\/iphone\\.myzaker\\.com\\/zaker\\/follow_promote\\.php\\?"
      filter: ".data.list |= map(select(.type != \"web\"))"
  - response_jq:
      match: "^https:\\/\\/iphone\\.myzaker\\.com\\/zaker\\/car_tab\\/index\\.php\\?"
      filter: ".data.gallery |= map(select(.type != \"web\"))"
