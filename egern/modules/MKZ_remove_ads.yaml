name: "漫客栈去广告"
description: "移除开屏广告、漫画广告、小说章末广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MKZ.png"
mitm:
  hostnames:
    - "base.mkzcdn.com"
scriptings:
  - http_response:
      name: "配置修改"
      match: "/^https:\\/\\/base\\.mkzcdn\\.com\\/app\\/config\\//i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/MKZ/MKZ_remove_ads.js"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/base\\.mkzcdn\\.com\\/advert\\/app\\/read\\/v\\d/i":
        reject-dict: true
    - "/^https:\\/\\/base\\.mkzcdn\\.com\\/advert\\/app\\/story\\/read\\/v\\d/i":
        reject-dict: true
    - "/^https:\\/\\/base\\.mkzcdn\\.com\\/advert\\/app\\/task\\/motivate\\/v\\d/i":
        reject-dict: true
    - "/^https:\\/\\/base\\.mkzcdn\\.com\\/advert\\/app\\/task\\/motivate\\/v\\d/i":
        reject-dict: true
    - "/^https:\\/\\/base\\.mkzcdn\\.com\\/advert\\/app\\/user\\/slide\\d\\/v\\d\\//i":
        reject-dict: true
