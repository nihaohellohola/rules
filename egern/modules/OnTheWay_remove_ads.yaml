name: "行者户外去广告"
description: "移除弹窗广告、发现页面横幅推广的推广金刚位，移除我的页面横幅推广。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/OnTheWay.png"
mitm:
  hostnames:
    - "www.imxingzhe.com"
http:
  rewrite:
    - "/^https:\\/\\/www\\.imxingzhe\\.com\\/api\\/v1\\/pop\\/window\\/\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/www\\.imxingzhe\\.com\\/api\\/v4\\/account\\/get_user_info\\?"
      filter: "delpaths([[\"banner\"]])"
  - response_jq:
      match: "^https:\\/\\/www\\.imxingzhe\\.com\\/api\\/v4\\/discovery\\/ios\\/\\?"
      filter: "delpaths([[\"banners\"], [\"ad\"]])"
  - response_jq:
      match: "^https:\\/\\/www\\.imxingzhe\\.com\\/api\\/v4\\/discovery\\/ios\\/\\?"
      filter: ".display_areas |= map(select(.name == \"赛事\" or .name == \"行者帮\" or .name == \"头条\" or .name == \"排行榜\" or .name == \"约伴\"))"
