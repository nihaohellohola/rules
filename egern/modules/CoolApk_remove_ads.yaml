name: "酷安去广告"
description: "过滤酷安广告"
author: "RuCu6[https://github.com/RuCu6], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CoolApk.png"
mitm:
  hostnames:
    - "api.coolapk.com"
http:
  rewrite:
    - "/^https:\\/\\/api\\.coolapk\\.com\\/v6\\/search\\?.*type=hotSearch/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.coolapk\\.com\\/v6\\/feed\\/detail\\?"
      filter: ".data.hotReplyRows |= if . then map(select(.id?)) else . end | .data.topReplyRows |= if . then map(select(.id?)) else . end | reduce (\"detailSponsorCard\", \"include_goods\", \"include_goods_ids\") as $key (.; .data[$key]=[])"
  - response_jq:
      match: "^https:\\/\\/api\\.coolapk\\.com\\/v6\\/feed\\/replyList"
      filter: "if .data? and ((.data | type) == \"array\") and (.data | length > 0) then .data |= map(select(.id?)) else . end"
  - response_jq:
      match: "^https:\\/\\/api\\.coolapk\\.com\\/v6\\/main\\/dataList"
      filter: ".data |= (if (type==\"array\" and length>0) then map(select((.entityTemplate!=\"sponsorCard\") and (.title!=\"精选配件\"))) else . end)"
  - response_jq:
      match: "^https:\\/\\/api\\.coolapk\\.com\\/v6\\/page\\/dataList"
      filter: "if (.data | length > 0) then .data |= map(select((.title? != \"酷安热搜\") and (.entityTemplate? != \"imageScaleCard\") and (.entityTemplate? != \"sponsorCard\"))) else . end"
  - response_jq:
      match: "^https:\\/\\/api\\.coolapk\\.com\\/v6\\/main\\/indexV8"
      filter: ".data |= (if length > 0 then map(select((.entityTemplate != \"sponsorCard\") and ([8639,29349,33006,32557] | index(.entityId) | not) and ((.title // \"\" | test(\"值得买|红包\")) | not))) else . end)"
  - response_jq:
      match: "^https:\\/\\/api\\.coolapk\\.com\\/v6\\/main\\/init"
      filter: ".data |= map(select(.entityId? | [944,945,6390] | index(.) | not) | if .entityId == 20131 then .entities |= map(select(.title != \"酷品\")) else . end)"
