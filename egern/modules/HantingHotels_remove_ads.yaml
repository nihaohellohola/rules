name: "华住会去广告"
description: "移除弹窗、横幅，精简首页。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/HantingHotels.png"
mitm:
  hostnames:
    - "hweb-manager.huazhu.com"
    - "hweb-hotel.huazhu.com"
    - "res-pub.huazhu.com"
http:
  rewrite:
    - "/^https:\\/\\/hweb-manager\\.huazhu\\.com\\/notice\\/getAppPopupNotifyAlert$/i":
        reject-dict: true
    - "/^https:\\/\\/hweb-hotel\\.huazhu\\.com\\/home\\/getHomeLoinBanner$/i":
        reject-dict: true
    - "/^https:\\/\\/hweb-hotel\\.huazhu\\.com\\/\\/home\\/querySelectHotel$/i":
        reject-dict: true
    - "/^https:\\/\\/hweb-hotel\\.huazhu\\.com\\/home\\/queryHotelBrand$/i":
        reject-dict: true
    - "/^https:\\/\\/hweb-manager\\.huazhu\\.com\\/hotels\\/ad\\/getHotelListNoticeMerge$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/res-pub\\.huazhu\\.com\\/frontconf\\/homeconfig_45\\/\\w+\\.json$"
      filter: "if has(\"content\") and (.content | type) == \"object\" then .content |= with_entries(select(.key == \"topBanner\" or .key == \"topBannerImages\")) else . end"
  - response_jq:
      match: "^https:\\/\\/res-pub\\.huazhu\\.com\\/frontconf\\/tabbarconfig_45\\/\\w+\\.json$"
      filter: ".content.tabbar |= map(select(.attributes.tabName == \"首页\" or .attributes.tabName == \"服务\" or .attributes.tabName == \"我的\"))"
