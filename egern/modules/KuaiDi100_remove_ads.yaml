name: "快递100去广告"
description: "移除横幅广告、弹窗广告，精简首页。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuaiDi100.png"
mitm:
  hostnames:
    - "p.kuaidi100.com"
http:
  rewrite:
    - "/^https?:\\/\\/p\\.kuaidi100\\.com\\/advertisement\\//i":
        reject-dict: true
    - "/^https?:\\/\\/p\\.kuaidi100\\.com\\/e-commerce\\/act\\/actInfo\\?/i":
        reject-dict: true
    - "/^https?:\\/\\/p\\.kuaidi100\\.com\\/apicenter\\/card\\.dox/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https?:\\/\\/p\\.kuaidi100\\.com\\/mobile\\/mobileapi\\.do$"
      filter: "delpaths([[\"adsplash\"], [\"adIsConsumable\"], [\"adProductId\"], [\"nologin_tips\"], [\"index_banner\"], [\"me_banner\"], [\"index_banner_shadow\"], [\"adshongbao\"], [\"adsapp_homepage_ticket_pop\"], [\"adsoptimizationsend\"], [\"adsapp_activity_ad_array\"], [\"adbanner\"], [\"adposition\"], [\"adShowAgainTime\"]])"
  - response_jq:
      match: "^https?:\\/\\/p\\.kuaidi100\\.com\\/apicenter\\/xcx\\.dox"
      filter: "delpaths([[\"data\", \"secondMenuList\"]])"
