name: "小桔充电去广告"
description: "移除横幅广告、弹窗广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/XiaojukejiCharge.png"
mitm:
  hostnames:
    - "energy.xiaojukeji.com"
    - "am.didistatic.com"
http:
