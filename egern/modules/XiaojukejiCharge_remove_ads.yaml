    - "/^https:\\/\\/energy\\.xiaojukeji\\.com\\/energy\\/hummer\\/api\\/resource\\/display($|\\?)/i":
        reject-dict: true
    - "/^https:\\/\\/energy\\.xiaojukeji\\.com\\/lego\\/api\\/orderSprint\\/stair\\/info($|\\?)/i":
        reject-dict: true
    - "/^https:\\/\\/energy\\.xiaojukeji\\.com\\/station-api\\/search\\/preWords$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/energy\\.xiaojukeji\\.com\\/am\\/marketing\\/api\\/member\\/facade\\/charge\\/personal\\/center\\?"
      filter: "delpaths([[\"data\"]])"
