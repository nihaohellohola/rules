name: "配音秀去广告"
description: "移除开屏广告、弹窗、横幅、各类关注推荐。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DubbingShow.png"
mitm:
  hostnames:
    - "iosapi.peiyinxiu.com"
scriptings:
  - http_response:
      name: "移除首页底部弹窗"
      match: "^https:\\/\\/iosapi\\.peiyinxiu\\.com\\/Api\\/Film\\/GetConfigValue"
      body_required: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/iosapi\\.peiyinxiu\\.com\\/Api\\/live\\/LiveList"
      filter: "delpaths([[\"data\", \"banners\"]])"
  - response_jq:
      match: "^https:\\/\\/iosapi\\.peiyinxiu\\.com\\/api\\/live\\/FollowList"
      filter: "delpaths([[\"obj\", \"data\"]])"
  - response_jq:
      match: "^https:\\/\\/iosapi\\.peiyinxiu\\.com\\/Api\\/Friend\\/GetRecommendUsers"
      filter: "delpaths([[\"obj\", \"data\"]])"
  - response_jq:
      match: "^https:\\/\\/iosapi\\.peiyinxiu\\.com\\/api\\/Union\\/HomeData"
      filter: "delpaths([[\"obj\", \"data\"]])"
