name: "威锋去广告"
description: "移除开屏广告、信息流广告、文末广告、首页轮播图推广。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/WPForum.png"
mitm:
  hostnames:
    - "api.wfdata.club"
http:
  rewrite:
    - "/^https:\\/\\/api\\.wfdata\\.club\\/v2\\/yesfeng\\/yesList\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.wfdata\\.club\\/v2\\/yesfeng\\/slideshow\\?"
      filter: ".data |= map(select(.protocolId == 1))"
