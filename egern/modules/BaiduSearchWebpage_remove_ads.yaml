name: "百度网页去广告"
description: "移除百度搜索移动端网页的首页广告信息流"
author: "Keywos[https://github.com/Keywos]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Baidu.png"
mitm:
  hostnames:
    - "m.baidu.com"
    - "www.baidu.com"
scriptings:
  - http_response:
      name: "移除百度搜索首页信息流广告"
      match: "^https?:\\/\\/(www|m)\\.baidu\\.com\\/?($|\\?from=\\w{8,9})"
      body_required: true
