name: "天气通去广告"
description: "移除开屏广告、横幅广告、弹窗广告，精简底栏及我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TianQiTong.png"
mitm:
  hostnames:
    - "forecast.sina.cn"
    - "tqt.weibo.cn"
http:
  rewrite:
    - "/^https:\\/\\/forecast\\.sina\\.cn\\/app\\/overall\\/switch\\.php\\?/i":
        reject-dict: true
    - "/^https:\\/\\/tqt\\.weibo\\.cn\\/business\\/advert\\//i":
        reject-dict: true
    - "/^https:\\/\\/tqt\\.weibo\\.cn\\/user\\/device\\/ad_multi_star\\?/i":
        reject-dict: true
    - "/^https:\\/\\/tqt\\.weibo\\.cn\\/operation\\/activity\\//i":
        reject-dict: true
    - "/^https:\\/\\/tqt\\.weibo\\.cn\\/api\\/user\\/user\\/\\d\\.\\d\\/\\?method=personal_center$/i":
        reject-dict: true
