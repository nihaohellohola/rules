name: "薄荷健康去广告"
description: "移除记录页大家都在看、移除各类弹窗，移除广场横幅推广，精简代谢中心页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BooHee.png"
mitm:
  hostnames:
    - "api.boohee.com"
    - "bohe.sfo-tx-shanghai-01.saas.sensorsdata.cn"
    - "lego.boohee.com"
    - "status.boohee.com"
scriptings:
  - http_response:
      name: "移除广场推荐页面横幅"
      match: "/^https:\\/\\/api\\.boohee\\.com\\/meta-interface\\/v1\\/index\\/plaza-flow\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/BooHee/BooHee_remove_ads.js"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/api\\.boohee\\.com\\/meta-interface\\/v1\\/index\\/page_float_bubbles\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.boohee\\.com\\/meta-interface\\/v1\\/index\\/tool_buttons\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.boohee\\.com\\/app-interface\\/v1\\/search\\/search\\?/i":
        reject-dict: true
    - "/^https:\\/\\/status\\.boohee\\.com\\/api\\/v1\\/merged_messages$/i":
        reject-dict: true
    - "/^https:\\/\\/bohe\\.sfo-tx-shanghai-01\\.saas\\.sensorsdata\\.cn\\/api\\/v2\\/sfo\\/user_popup_configs\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.boohee\\.com\\/meta-interface\\/v1\\/index\\/sensor-banners\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.boohee\\.com\\/meta-interface\\/v2\\/index\\?"
      filter: "delpaths([[\"data\", \"recom_cards\"], [\"data\", \"recom_btns\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.boohee\\.com\\/meta-interface\\/v1\\/index\\/plaza\\?"
      filter: "delpaths([[\"data\", \"tabs[1]\", \"badge\"], [\"data\", \"recommend_ads\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.boohee\\.com\\/open-interface\\/v1\\/string\\/market_page\\?title=metabolism_config$"
      filter: "delpaths([[\"top_banner\"], [\"diagnos_config\"], [\"partner_hospital\"], [\"question_answer\"], [\"product\"], [\"brand_story\"]])"
