name: "ECOVACS HOME去广告"
description: "移除横幅推广，精简底栏。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/EcovacsHome.png"
mitm:
  hostnames:
    - "gl-cn-api.ecovacs.cn"
    - "api-app.dc-cn.cn.ecouser.net"
http:
  rewrite:
    - "/^https:\\/\\/api-app\\.dc-cn\\.cn\\.ecouser\\.net\\/api\\/ecms\\/app\\/ad\\//i":
        reject-dict: true
    - "/^https:\\/\\/gl-cn-api\\.ecovacs\\.cn\\/v1\\/private\\//i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/gl-cn-api\\.ecovacs\\.cn\\/v3\\/private\\/"
      filter: ".data.navigateInfoResponseList |= map(select(.positionType == \"Robot\" or .positionType == \"Mine\"))"
