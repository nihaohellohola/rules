name: "YouTube双语翻译"
description: "字幕增强及双语翻译，支持Youtube Music歌词翻译。此插件需要置于YouTube去广告插件之下，且和YouTube去广告插件的歌词翻译冲突，不支持tvOS设备。"
author: "VirgilClyne[https://github.com/VirgilClyne]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YouTube.png"
mitm:
  hostnames:
    - "www.youtube.com"
    - "m.youtube.com"
    - "tv.youtube.com"
    - "music.youtube.com"
    - "youtubei.googleapis.com"
scriptings:
  - http_response:
      name: "YouTube合成定时文本响应"
      match: "/^https?:\\/\\/(www|m)\\.youtube\\.com\\/api\\/timedtext\\?(.*)subtype=(Official|External)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/YouTube/YouTube_Subtitles_Translate/YouTube_Composite_Subtitles_response.js"
      body_required: true
  - http_response:
      name: "YouTube翻译定时文本响应"
      match: "/^https?:\\/\\/(www|m)\\.youtube\\.com\\/api\\/timedtext\\?(.*)subtype=Translate/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/YouTube/YouTube_Subtitles_Translate/YouTube_Subtitles_Translate_response.js"
      body_required: true
  - http_response:
      name: "JSON·YouTube Music翻译歌词响应"
      match: "/^https?:\\/\\/music\\.youtube\\.com\\/youtubei\\/v1\\/browse\\?(.*)subtype=Translate/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/YouTube/YouTube_Subtitles_Translate/YouTube_Subtitles_Translate_response.js"
      body_required: true
  - http_response:
      name: "Proto·YouTube Music翻译歌词响应"
      match: "/^https?:\\/\\/youtubei\\.googleapis\\.com\\/youtubei\\/v1\\/browse\\?(.*)subtype=Translate/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/YouTube/YouTube_Subtitles_Translate/YouTube_Subtitles_Translate_response.js"
      body_required: true
