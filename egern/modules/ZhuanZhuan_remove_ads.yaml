name: "转转去广告"
description: "移除开屏广告、应用内悬浮窗、信息流推广、商品推荐、首页弹窗，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZhuanZhuan.png"
mitm:
  hostnames:
    - "app.zhuanzhuan.com"
http:
  rewrite:
    - "/^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/v2\\/zzlogic\\/getOpenScreen$/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/v2\\/zzinfoshow\\/getwindvanecardv2$/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.zhuanzhuan\\.com\\/zzopen\\/popwindow\\/getallpopwin\\?/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.zhuanzhuan\\.com\\/zzopen\\/zzbmlogic\\/queryFrontPageWindowInfo\\?/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.zhuanzhuan\\.com\\/zzopen\\/ptuserlogic\\/subscribehotrecommend$/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.zhuanzhuan\\.com\\/zzopen\\/ypmall\\/listData$/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/v2\\/zzusercenter\\/myprofilevariouscards$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/v2\\/zzlogic\\/mycontinenthomepage\\?"
      filter: "delpaths([[\"respData\", \"topOpera\", \"leftOpera\"], [\"respData\", \"topOpera\", \"rightOpera2\"], [\"respData\", \"topActBanner\"], [\"respData\", \"bmArea\"]])"
  - response_jq:
      match: "^https:\\/\\/app\\.zhuanzhuan\\.com\\/zzx\\/transfer\\/getConfigInfo\\?"
      filter: "delpaths([[\"respData\", \"freeMarketTabLeadPop\"], [\"respData\", \"topOperations\"]])"
  - response_jq:
      match: "^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/v2\\/zzinfoshow\\/getfeedflowinfo\\?"
      filter: "if .respData.userRed.campName == \"OCD挂件\" then del(.respData.userRed) else . end | .respData.infoData |= map(del(.rotateResource,.appRecommendResource,.\"cargoGroupCardV2\"))"
  - response_jq:
      match: "^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/transfer\\/getmymoretools$"
      filter: "walk(if type == \"object\" and .name == \"免流量特权\" then empty else . end) | del(.respData.groupList[] | select(.groupName == \"活动参与\" or .groupName == \"金融工具\"))"
  - response_jq:
      match: "^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/transfer\\/getmyprofilev3$"
      filter: "delpaths([[\"respData\", \"bmNewInfo\"]])"
  - response_jq:
      match: "^https:\\/\\/app\\.zhuanzhuan\\.com\\/zz\\/transfer\\/getmyprofilev3$"
      filter: "del(.respData.itemGroupList[].itemList[] | select(.name == \"天天赚钱\" or .name == \"借钱\")) | del(.respData.itemGroupList[] | select(.groupType == 15))"
