name: "库街区去广告"
description: "移除开屏广告、弹窗广告、搜索页面的热搜及话题热榜。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuroBBS.png"
mitm:
  hostnames:
    - "api.kurobbs.com"
http:
  rewrite:
    - "/^https:\\/\\/api\\.kurobbs\\.com\\/config\\/getOpenScreen$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.kurobbs\\.com\\/config\\/index\\/windows$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.kurobbs\\.com\\/config\\/search\\/getSearchConfig\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.kurobbs\\.com\\/forum\\/app\\/topic\\/hotlist\\?/i":
        reject-dict: true
