name: "腾讯视频去广告"
description: "过滤腾讯视频客户端广告，如遇失效，则需要重新安装腾讯视频客户端。由于此插件不再维护，客户端版本高于8.9.40可能会导致此插件失效，请勿升级客户端。"
author: "RuCu6[https://github.com/RuCu6]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Tencent_Video.png"
mitm:
  hostnames:
    - "vv.video.qq.com"
rules:
  - domain:
      match: "adsmind.gdtimg.com"
      policy: REJECT
  - domain:
      match: "info4.video.qq.com"
      policy: REJECT
  - domain:
      match: "info6.video.qq.com"
      policy: REJECT
  - domain:
      match: "ios.video.mpush.qq.com"
      policy: REJECT
  - domain:
      match: "otheve.beacon.qq.com"
      policy: REJECT
  - domain:
      match: "pgdt.gtimg.cn"
      policy: REJECT
  - domain:
      match: "tpns.qq.com"
      policy: REJECT
  - domain:
      match: "vv6.video.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "gdt.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "l.qq.com"
      policy: REJECT
  - domain_keyword:
      match: "trace.qq.com"
      policy: REJECT
  - domain_keyword:
      match: "trace.video.qq.com"
      policy: REJECT
  - ip_cidr:
      match: "47.110.187.87/32"
      policy: REJECT
      no_resolve: true
  - url_regex:
      match: "^http:\\/\\/[\\d\\.:]*\\/?(defaultts\\.tc|vmind\\.qqvideo\\.tc|finderpdd\\.video)\\.qq\\.com\\/\\w+"
      policy: REJECT
  - url_regex:
      match: "^http:\\/\\/apd-vlive\\.apdcdn\\.tc\\.qq\\.com\\/vmind\\.qqvideo\\.tc\\.qq\\.com\\/\\w+"
      policy: REJECT
  - url_regex:
      match: "^http:\\/\\/apd-\\w+\\.v\\.smtcdns\\.com\\/(defaultts|omts|vmind\\.qqvideo)\\.tc\\.qq\\.com\\/\\w+"
      policy: REJECT
scriptings:
  - http_request:
      name: "移除广告"
      match: "^https?:\\/\\/vv\\.video\\.qq\\.com\\/getvinfo"
      script_url: "https://kelee.one/Resource/JavaScript/CommonScript/replace-body.js"
      body_required: true
      arguments:
        "_compat.$argument": "&sppreviewtype=\\\\d(.*)&spsrt=\\\\d->&sppreviewtype=0$1&spsrt=0"
http:
  rewrite:
    - "/^https?:\\/\\/vv\\.video\\.qq\\.com\\/(diff|get)vmind/i":
        reject-dict: true
