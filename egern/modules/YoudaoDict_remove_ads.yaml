name: "网易有道词典去广告"
description: "移除开屏广告、弹窗广告、右上角推广。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YoudaoDict.png"
mitm:
  hostnames:
    - "dict.youdao.com"
http:
  rewrite:
    - "/^https:\\/\\/dict\\.youdao\\.com\\/vip\\/activity\\/startup\\//i":
        reject-dict: true
    - "/^https:\\/\\/dict\\.youdao\\.com\\/vip\\/activity\\/retention\\/configs\\?/i":
        reject-dict: true
    - "/^https:\\/\\/dict\\.youdao\\.com\\/vip\\/activity\\/retention\\/match\\?/i":
        reject-dict: true
    - "/^https:\\/\\/dict\\.youdao\\.com\\/vip\\/user\\/paid\\/guide\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/dict\\.youdao\\.com\\/homepage\\/toolbar\\/get\\/"
      filter: "delpaths([[\"data\", \"vipTag\"]])"
