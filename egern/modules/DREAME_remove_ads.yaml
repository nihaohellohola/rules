name: "DREAME去广告"
description: "移除开屏广告、首页大图推广、横幅推广，精简底栏，阻止桌面图标替换。仅支持2.5.1版。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DREAME.png"
mitm:
  hostnames:
    - "cn-mall.dreame.tech"
    - "cn-wxmall.dreame.tech"
    - "cn.iot.dreame.tech"
http:
  rewrite:
    - "/^https:\\/\\/cn\\.iot\\.dreame\\.tech:\\d+\\/dreame-product\\/public\\/advertisement\\//i":
        reject-dict: true
    - "/^https:\\/\\/cn-mall\\.dreame\\.tech\\/dreame-mall\\/api\\/v1\\/tag\\/list$/i":
        reject-dict: true
    - "/^https:\\/\\/cn-wxmall\\.dreame\\.tech\\/main\\/goods\\/get-topgoods$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/cn\\.iot\\.dreame\\.tech:13267\\/dreame-system\\/dreame-app\\/setting\\/query$"
      filter: "delpaths([[\"data\", \"appIconConfig\"]])"
