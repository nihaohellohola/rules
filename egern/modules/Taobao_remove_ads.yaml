name: "淘宝去广告"
description: "过滤淘宝开屏广告"
author: "RuCu6[https://github.com/RuCu6]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Taobao.png"
mitm:
  hostnames:
    - "acs.m.taobao.com"
    - "heic.alicdn.com"
    - "guide-acs.m.taobao.com"
    - "poplayer.template.alibaba.com"
rules:
  - domain:
      match: "adashx.m.taobao.com"
      policy: REJECT
  - domain:
      match: "ossgw.alicdn.com"
      policy: REJECT
  - domain:
      match: "ems.youku.com"
      policy: REJECT
  - domain:
      match: "hudong.alicdn.com"
      policy: REJECT
  - domain:
      match: "h-adashx.ut.taobao.com"
      policy: REJECT
  - domain:
      match: "ut.taobao.com"
      policy: REJECT
scriptings:
  - http_response:
      name: "移除淘宝开屏广告"
      match: "^https:\\/\\/guide-acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.taobao\\.(cloudvideo\\.video\\.query|wireless\\.home\\.splash\\.awesome\\.get)"
      body_required: true
  - http_response:
      name: "移除淘宝开屏广告"
      match: "^https:\\/\\/poplayer\\.template\\.alibaba\\.com\\/\\w+\\.json"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.fliggy\\.crm\\.screen\\.(allresource|predict)/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.alibaba\\.advertisementservice\\.getadv/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.alimama\\.etao\\.config\\.query\\/.+?etao_advertise/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.alimusic\\.common\\.mobileservice\\.startinit/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.etao\\.noah\\.query\\/.+tao_splash/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.film\\.mtopadvertiseapi\\.queryadvertise/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.o2o\\.ad\\.gateway\\.get/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.taobao\\.idle\\.home\\.welcome/i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.trip\\.activity\\.querytmsresources/i":
        reject-dict: true
    - "/^https:\\/\\/(?:gw|heic)\\.alicdn\\.com\\/imgextra\\/i\\d\\/\\d*\\/?[\\w!]+-\\d-(?:octopus|tps)-(?:1080|1125)-\\d{4}\\.(?:jpg|png)_(?:1\\d{3}|9\\d{2})x(?:\\d|1\\d{3}|9\\d{2})q[59]0/i":
        reject-dict: true
    - "/^https:\\/\\/guide-acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.taobao\\.(volvo\\.secondfloor\\.getconfig|wireless\\.home\\.newface\\.awesome\\.get)/i":
        reject-dict: true
