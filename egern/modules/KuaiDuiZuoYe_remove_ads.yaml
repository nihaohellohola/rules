name: "快对去广告"
description: "移除开屏广告、横幅推广，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KuaiDuiZuoYe.png"
mitm:
  hostnames:
    - "www.kuaiduizuoye.com"
    - "apivip.kuaiduizuoye.com"
http:
  rewrite:
    - "/^https:\\/\\/www\\.kuaiduizuoye\\.com\\/init\\/ad\\//i":
        reject-dict: true
    - "/^https:\\/\\/www\\.kuaiduizuoye\\.com\\/activity\\/init\\/checkappconfig$/i":
        reject-dict: true
    - "/^https:\\/\\/www\\.kuaiduizuoye\\.com\\/kdapi\\/conf\\/appbannersv3$/i":
        reject-dict: true
    - "/^https:\\/\\/www\\.kuaiduizuoye\\.com\\/kdapi\\/conf\\/initbanner$/i":
        reject-dict: true
    - "/^https:\\/\\/apivip\\.kuaiduizuoye\\.com\\/viponline\\/scancode\\/mycard$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/www\\.kuaiduizuoye\\.com\\/codesearch\\/aid\\/home$"
      filter: "delpaths([[\"data\", \"homeBannerList\"]])"
