name: "VVebo时间线修复"
description: "修复失效的用户时间线和我的页面。使用此插件前需要禁用微博去广告插件，避免插件冲突导致失效。"
author: "suiyuran[https://github.com/suiyuran], androidcn[https://github.com/androidcn]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/VVebo.png"
mitm:
  hostnames:
    - "api.weibo.cn"
scriptings:
  - http_request:
      name: "修复时间线"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/users\\/show\\?"
  - http_request:
      name: "修复时间线"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/statuses\\/user_timeline\\?"
  - http_request:
      name: "修复时间线"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/remind\\/unread_count\\?"
  - http_response:
      name: "修复时间线"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/profile\\/statuses\\/tab\\?"
      body_required: true
  - http_response:
      name: "修复我的页面"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/cardlist\\?"
      body_required: true
