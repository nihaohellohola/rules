name: "成分喵去广告"
description: "移除首页推广活动、广告组件请求、移除被查商品购买链接、搜索发现。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ChengFenMiao.png"
mitm:
  hostnames:
    - "app.chengfenmiao.com"
http:
  rewrite:
    - "/^https:\\/\\/app\\.chengfenmiao\\.com\\/Listing\\/LiveHots\\?/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.chengfenmiao\\.com\\/helper\\/VersionCheck\\?/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.chengfenmiao\\.com\\/item\\/closet\\?/i":
        reject-dict: true
    - "/^https:\\/\\/app\\.chengfenmiao\\.com\\/Helper\\/HotWords\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/app\\.chengfenmiao\\.com\\/helper\\/setting\\?"
      filter: "delpaths([[\"detail_buy_sites\"], [\"bottom_sites\"]])"
