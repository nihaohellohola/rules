        reject-dict: true
    - "/^https:\\/\\/api-bc\\.wtzw\\.com\\/api\\/v4\\/search\\/dispose/i":
        reject-dict: true
    - "/^https:\\/\\/api-bc\\.wtzw\\.com\\/api\\/v\\d\\/book-store\\/config/i":
        reject-dict: true
    - "/^https:\\/\\/api-bc\\.wtzw\\.com\\/api\\/v\\d\\/book-store\\/push-book/i":
        reject-dict: true
