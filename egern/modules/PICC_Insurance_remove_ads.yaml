name: "中国人保去广告"
description: "移除中国人保开屏广告和应用内广告"
author: "Sliverkiss[https://github.com/Sliverkiss]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/PICC_Insurance.png"
mitm:
  hostnames:
    - "zgrb.epicc.com.cn"
scriptings:
  - http_response:
      name: "移除主页推广"
      match: "/^https:\\/\\/zgrb\\.epicc\\.com\\.cn\\/G-HAPP\\/a\\/config\\/homeInit\\/v3/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/PICC_Insurance/PICC_Insurance_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除我的页面推广"
      match: "/^https:\\/\\/zgrb\\.epicc\\.com\\.cn\\/G-HAPP\\/mpageconfig\\/myPageConfigList\\/v3/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/PICC_Insurance/PICC_Insurance_remove_ads.js"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/zgrb\\.epicc\\.com\\.cn\\/G-HAPP\\/h\\/headlines\\/queryHeadlines/i":
        reject: true
    - "/^https:\\/\\/zgrb\\.epicc\\.com\\.cn\\/G-HAPP\\/a\\/update\\/startupPage\\/v1/i":
        reject-dict: true
    - "/^https:\\/\\/zgrb\\.epicc\\.com\\.cn\\/G-HAPP\\/a\\/config\\/guessYouLike\\/v3/i":
        reject-dict: true
