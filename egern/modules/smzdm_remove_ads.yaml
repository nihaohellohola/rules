name: "什么值得买去广告"
description: "移除开屏广告、信息流广告、各类横幅广告、搜索页广告、文章内广告，移除活动皮肤、精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/smzdm.png"
mitm:
  hostnames:
    - "app-api.smzdm.com"
    - "homepage-api.smzdm.com"
    - "h5.smzdm.com"
    - "haojia-api.smzdm.com"
    - "haojia.m.smzdm.com"
    - "user-api.smzdm.com"
    - "article-api.smzdm.com"
    - "s-api.smzdm.com"
    - "haojia-cdn.smzdm.com"
    - "post.m.smzdm.com"
http:
  rewrite:
    - "/^https:\\/\\/app-api\\.smzdm\\.com\\/util\\/loading\\?/i":
        reject-dict: true
    - "/^https:\\/\\/app-api\\.smzdm\\.com\\/mychannel\\/list$/i":
        reject-dict: true
    - "/^https:\\/\\/h5\\.smzdm\\.com\\/user\\/coupon\\/coupon_list\\?/i":
        reject: true
    - "/^https:\\/\\/user-api\\.smzdm\\.com\\/vip\\/bottom_card_list\\?/i":
        reject-dict: true
    - "/^https:\\/\\/article-api\\.smzdm\\.com\\/publish\\/get_bubble\\?/i":
        reject-dict: true
    - "/^https:\\/\\/s-api\\.smzdm\\.com\\/sou\\/search_default_keyword\\?/i":
        reject-dict: true
    - "/^https:\\/\\/s-api\\.smzdm\\.com\\/sou\\/popup_coupon\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/app-api\\.smzdm\\.com\\/util\\/update$"
      filter: "setpath([\"data\", \"silence_local_push\"]; 0) | setpath([\"data\", \"baichuan_redirect_switch\"]; 0)"
  - response_jq:
      match: "^https:\\/\\/app-api\\.smzdm\\.com\\/util\\/update$"
      filter: "delpaths([[\"data\", \"silence_local_push_msg\"], [\"data\", \"video_cache_num_configs\"], [\"data\", \"haojia_widget\"], [\"data\", \"widget\"], [\"data\", \"operation_float\"]])"
  - response_jq:
      match: "^https:\\/\\/app-api\\.smzdm\\.com\\/util\\/update$"
      filter: "def r: if type==\"object\" then if has(\"ad_campaign_name\") and (.ad_campaign_name|type==\"string\") and (.ad_campaign_name|test(\"\\\\S\")) then empty else . end elif type==\"array\" then map(r) else . end; .data.operation_float |= map(map(r))"
  - response_jq:
      match: "^https:\\/\\/homepage-api\\.smzdm\\.com\\/v3\\/home\\?"
      filter: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JQLang/smzdm/home_smzdm_remove_ads.jq"
  - response_jq:
      match: "^https:\\/\\/haojia-api\\.smzdm\\.com\\/home\\/list\\?"
      filter: "delpaths([[\"data\", \"header_operation\", \"theme\"]])"
  - response_jq:
      match: "^https:\\/\\/haojia-api\\.smzdm\\.com\\/home\\/list\\?"
      filter: ".data.rows |= map(select(.cell_type == \"39001\")) | .data.banner_v2 |= map(select(.cell_type == \"21028\"))"
  - response_jq:
      match: "^https:\\/\\/haojia\\.m\\.smzdm\\.com\\/detail_modul\\/user_related_modul\\?"
      filter: "delpaths([[\"data\", \"super_coupon\"]])"
  - response_jq:
      match: "^https:\\/\\/haojia\\.m\\.smzdm\\.com\\/detail_modul\\/other_modul\\?"
      filter: "delpaths([[\"data\", \"banner\"]])"
  - response_jq:
      match: "^https:\\/\\/user-api\\.smzdm\\.com\\/vip$"
      filter: "delpaths([[\"data\", \"activity_entrance_info\"], [\"data\", \"big_banner\"], [\"data\", \"top_banner\"], [\"data\", \"banner_switch\"], [\"data\", \"yaoqingshaiwu\"], [\"data\", \"right_info\"]])"
  - response_jq:
      match: "^https:\\/\\/s-api\\.smzdm\\.com\\/sou\\/list_v10\\?"
      filter: ".data.rows |= map(select(.model_type != \"ads\")) | .data.top_aladdin |= map(select(has(\"ad\") | not))"
  - response_jq:
      match: "^https:\\/\\/s-api\\.smzdm\\.com\\/sou\\/filter\\/tags\\/hot_tags\\?"
      filter: "delpaths([[\"data\", \"search_faxian\"], [\"data\", \"tonglan\"], [\"data\", \"hongbao\"]])"
  - response_jq:
      match: "^https:\\/\\/s-api\\.smzdm\\.com\\/sou\\/filter\\/tags\\/hot_tags\\?"
      filter: ".data.hot_tab |= (if type == \"array\" then map(select(.search_method != \"热点主题榜\")) else . end) | if .data.hot_tab then .data.hot_tab |= map(if .search_method == \"热搜榜搜索热榜\" and .rows then .rows |= map(select(.pos != null and ((.pos | tonumber) != null))) else . end) else . end"
  - response_jq:
      match: "^https:\\/\\/haojia-api\\.smzdm\\.com\\/detail\\/\\d+\\?"
      filter: "delpaths([[\"data\", \"quan_log\"]])"
  - response_jq:
      match: "^https:\\/\\/haojia-cdn\\.smzdm\\.com\\/preload\\/\\d+\\/fiphone\\/v\\d+_\\d+_\\d+\\/wx\\d+\\/im\\d+\\/[0-9a-z]+\\/[0-9a-z]+\\.json$"
      filter: "delpaths([[\"data\", \"quan_log\"]])"
  - response_jq:
      match: "^https:\\/\\/post\\.m\\.smzdm\\.com\\/ajax_app\\/ajax_get_footer_list\\?"
      filter: "delpaths([[\"data\", \"tuiguang_ad\"], [\"data\", \"activity_banner\"]])"
