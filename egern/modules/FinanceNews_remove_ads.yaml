name: "华尔街见闻去广告"
description: "移除开屏广告、文末广告、信息流广告，精简底栏。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/FinanceNews.png"
mitm:
  hostnames:
    - "api-one-wscn.awtmt.com"
http:
  rewrite:
    - "/^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/advertising\\//i":
        reject-dict: true
    - "/^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/kvconfig\\/items\\/search_keywords_wscnvip$/i":
        reject-dict: true
    - "/^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/search\\/hotsearch\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/content\\/articles\\/hot\\?/i":
        reject-dict: true
    - "/^https:\\/\\/wallstreetcn\\.com\\/app-faas\\/coupon\\/user\\/search\\/popup$/i":
        reject-dict: true
    - "/^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/content\\/lives\\/relateddata\\//i":
        reject-dict: true
    - "/^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/content\\/articles\\/relateddata\\//i":
        reject-dict: true
    - "/^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/content\\/carousel\\/information-flow\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/kvconfig\\/items\\/tabbarconfig1$"
      filter: ".data.items |= [.[] | select(.key == \"news\" or .key == \"live\")]"
  - response_jq:
      match: "^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/apiv1\\/content\\/articles\\/"
      filter: "delpaths([[\"data\", \"recommend_vip_img_uri\"]])"
  - response_jq:
      match: "^https:\\/\\/api-one-wscn\\.awtmt\\.com\\/\\/apiv1\\/kvconfig\\/items\\/membersrights$"
      filter: "delpaths([[\"data\", \"vip_article\"]])"
