name: "Spotify去广告"
description: "移除播放广告，恢复歌手和专辑列表的正常展示。修改插件自定义配置项需要重新登陆方可生效。"
author: "001ProMax[https://github.com/001ProMax]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Spotify.png"
mitm:
  hostnames:
    - "*-spclient.spotify.com"
    - "spclient.wg.spotify.com"
scriptings:
  - http_response:
      name: "Protobuf处理"
      match: "^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/(?:bootstrap|user-customization-service)"
      timeout: 5
      body_required: true
      binary_body: true
      arguments:
        "_compat.$argument": "tab=false&useractivity=true"
http:
  rewrite:
    - "/^https:\\/\\/(?:\\w+-spclient|spclient\\.wg)\\.spotify\\.com(?::443)?\\/pendragon\\//i":
        reject-dict: true
