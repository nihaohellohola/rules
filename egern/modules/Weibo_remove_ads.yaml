name: "微博去广告"
description: "过滤微博广告及去除各部分推广模块"
author: "RuCu6[https://github.com/RuCu6], zmqcherish[https://github.com/zmqcherish]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weibo.png"
mitm:
  hostnames:
    - "*.weibo.cn"
    - "*.weibo.com"
    - "weibo.com"
scriptings:
  - http_response:
      name: "移除首页推广"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/(?:checkin\\/show|client\\/publisher_list|push\\/active)"
      body_required: true
  - http_response:
      name: "移除首页顶部标签"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/groups\\/allgroups\\/v2\\?"
      body_required: true
  - http_response:
      name: "移除信息流广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/(?:cardlist|page)"
      body_required: true
  - http_response:
      name: "移除评论区广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/comments\\/build_comments\\?"
      body_required: true
  - http_response:
      name: "移除个人微博详情页广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/(?:container\\/asyn|flowlist|flowpage)"
      body_required: true
  - http_response:
      name: "移除关注、取消关注弹窗"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/friendships\\/(?:create|destroy)"
      body_required: true
  - http_response:
      name: "移除个人主页广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/profile\\/(?:container_timeline|dealatt|me|statuses\\/tab|userinfo)"
      body_required: true
  - http_response:
      name: "移除超话搜索页广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/shproxy\\/chaohua\\/discovery\\/searchactive\\?"
      body_required: true
  - http_response:
      name: "移除评论区广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/statuses\\/(?:comments_expand_child|container_detail_comment)"
      body_required: true
  - http_response:
      name: "移除信息流广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/statuses\\/(?:container_detail\\?|container_timeline(?:_hot|_topic|_topicpage|_unread)?|repost_timeline|unread_hot_timeline)"
      body_required: true
  - http_response:
      name: "移除微博详情页广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/statuses\\/(?:extend|show)\\?"
      body_required: true
  - http_response:
      name: "移除视频流广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/video\\/(?:full_screen_stream|tiny_stream_mid_detail|tiny_stream_video_list)\\?"
      body_required: true
  - http_response:
      name: "移除超话顶部标签"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/!\\/huati\\/discovery_home_bottom_channels\\?"
      body_required: true
  - http_response:
      name: "移除消息页列表广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/direct_messages\\/user_list\\?"
      body_required: true
  - http_response:
      name: "移除消息页提醒"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/messageflow\\/notice\\?"
      body_required: true
  - http_response:
      name: "移除热门微博信息流广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/search\\/(?:container_timeline|finder)\\?"
      body_required: true
  - http_response:
      name: "移除发现页搜索结果广告"
      match: "^https:\\/\\/api\\.weibo\\.cn\\/2\\/searchall\\?"
      body_required: true
  - http_response:
      name: "移除开屏广告 preload"
      match: "^https:\\/\\/bootpreload\\.uve\\.weibo\\.com\\/v[12]\\/ad\\/preload"
      body_required: true
  - http_response:
      name: "移除开屏广告 sdkad"
      match: "^https:\\/\\/sdkapp\\.uve\\.weibo\\.com\\/interface\\/sdk\\/sdkad\\.php"
      body_required: true
  - http_response:
      name: "移除开屏广告 wbapplua"
      match: "^https:\\/\\/wbapp\\.uve\\.weibo\\.com\\/(?:preload\\/get_ad|wbapplua\\/wbpullad\\.lua)"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/(?:ug\\/checkin\\/list|push\\/daily|push\\/info)/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/!\\/live\\/media_homelist\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/comments\\/bullet_screens\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/photo\\/info\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/statuses\\/(?:container_positive|push_info)/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/vote\\/get_vote_detail\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/!\\/chaohua\\/discovery\\/home_bottom\\/switch\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/!\\/huati\\/(?:discovery_home_bottom_getdotinfo|mobile_discovery_searchchange)/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/!\\/wbox\\/\\w+\\/(?:home_bottom_modal|interest_category)/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/search\\/(?:container_discover|finder_nav_polling)\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/hot\\/hours_spotlight\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/video\\/redpacket\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/!\\/(?:search\\/finder_nav_polling|sug\\/list\\/finderchange|was\\/finder\\/searchbarchange)\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.weibo\\.cn\\/2\\/video\\/tiny_video_info_show\\?/i":
        reject-dict: true
    - "/^https:\\/\\/bootrealtime\\.uve\\.weibo\\.com\\/v[23]\\/ad\\/realtime/i":
        reject-dict: true
    - "/^https:\\/\\/sdkapp\\.uve\\.weibo\\.com\\/interface\\/sdk\\/(?:get-lbs-cell-info\\.php|sdkconfig\\.php)/i":
        reject-dict: true
    - "/^https:\\/\\/card\\.weibo\\.com\\/article\\/m\\/aj\\/(?:reward|uvead)/i":
        reject-dict: true
    - "/^https:\\/\\/weibo\\.com\\/ttarticle\\/x\\/m\\/aj\\/(?:reward|uvead)/i":
        reject-dict: true
