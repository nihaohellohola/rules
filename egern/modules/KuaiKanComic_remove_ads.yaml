    - "api.kkmh.com"
    - "cdn-api.kkmh.com"
    - "social.kkmh.com"
    - "cdn-social.kkmh.com"
    - "h5.kuaikanmanhua.com"
    - "cdn-h5.kuaikanmanhua.com"
    - "pay.kkmh.com"
    - "cdn-pay.kkmh.com"
    - "shop.kkmh.com"
    - "cdn-shop.kkmh.com"
    - "topic.kkmh.com"
    - "cdn-topic.kkmh.com"
scriptings:
  - http_response:
      name: "修改广告参数"
      match: "/^https:\\/\\/(cdn-)?api\\.kkmh\\.com\\/v\\d\\/ironman\\/comic\\/recommend/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/KuaiKanComic/KuaiKanComic_remove_ads.js"
      body_required: true
  - http_response:
      name: "精简首页热门标签"
      match: "/^https:\\/\\/(cdn-)?api\\.kkmh\\.com\\/v\\d\\/ironman\\/discovery_v\\d\\/tab_list_v\\d/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/KuaiKanComic/KuaiKanComic_remove_ads.js"
      body_required: true
  - http_response:
      name: "精简社区标签"
      match: "/^https:\\/\\/(cdn-)?social\\.kkmh\\.com\\/v\\d\\/graph\\/homepage\\/comicVideo\\/v\\d\\/configs/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/KuaiKanComic/KuaiKanComic_remove_ads.js"
      body_required: true
  - http_response:
      name: "精简社区信息流"
      match: "/^https:\\/\\/(cdn-)?social\\.kkmh\\.com\\/v\\d\\/graph\\/unified_feed$/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/KuaiKanComic/KuaiKanComic_remove_ads.js"
      body_required: true
