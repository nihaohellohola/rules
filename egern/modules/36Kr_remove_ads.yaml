name: "36氪去广告"
description: "移除开屏广告、首页右上角运营位、信息流广告、文末广告，移除相关文章推荐、大家都在看及皮肤配置，精简搜索页面、我的页面及底栏。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/36Kr.png"
mitm:
  hostnames:
    - "gateway.36kr.com"
    - "36kr.com"
http:
  rewrite:
    - "/^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/nav\\/me\\/recom\\?/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/nav\\/search\\/hotword\\?/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/nav\\/search\\/topicListV2\\?/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.36kr\\.com\\/api\\/adx\\//i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/page\\/article\\/recom\\?/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/page\\/newsflash\\/recom\\?/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/sys\\/skin\\//i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/sys\\/config\\?"
      filter: "delpaths([[\"data\", \"contentConfig\"], [\"data\", \"positionConfigList\"], [\"data\", \"switchConfig\", \"ios\", \"sunrise_sign\"], [\"data\", \"switchConfig\", \"ios\", \"sunrise_sunit_task\"], [\"data\", \"switchConfig\", \"ios\", \"sunrise_sunit_mall\"], [\"data\", \"switchConfig\", \"ios\", \"sunrise_distribution_icon\"], [\"data\", \"secondFloorConfig\"]])"
  - response_jq:
      match: "^https:\\/\\/36kr\\.com\\/global\\/sensors\\/config\\/iOS\\.conf\\?"
      filter: "setpath([\"configs\", \"disableSDK\"]; true)"
  - response_jq:
      match: "^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/nav\\?"
      filter: ".data.navList |= [ .[] | select(.navNick == \"home\" or .navNick == \"newsflash\" or .navNick == \"me\") ]"
  - response_jq:
      match: "^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/nav\\/home\\/subnav\\/recom\\?"
      filter: ".data.bannerList |= map(select(.itemType != 0))"
  - response_jq:
      match: "^https:\\/\\/gateway\\.36kr\\.com\\/api\\/mis\\/nav\\/home\\/subnav\\/flow\\/"
      filter: "delpaths([[\"data\", \"adItemList\"]])"
