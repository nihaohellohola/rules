name: "Sub-Store"
description: "高级订阅管理工具，定时任务默认为每天23点55分，可在插件设置中自定义。使用前请在本插件的详情页面为[PROXY]项分配代理策略。"
author: "Peng-YM[https://github.com/Peng-YM]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/Other_icon/120px/Sub-Store.png"
mitm:
  hostnames:
    - "sub.store"
scriptings:
  - http_request:
      name: "Sub-Store Core"
      match: "^https?:\\/\\/sub\\.store\\/((download)|api\\/(preview|sync|(utils\\/node-info)))"
      timeout: 120
      body_required: true
  - http_request:
      name: "Sub-Store Simple"
      match: "^https?:\\/\\/sub\\.store"
      timeout: 120
      body_required: true
  - schedule:
      name: "Sub-Store Sync"
      cron: "55 23 * * *"
      timeout: 120
