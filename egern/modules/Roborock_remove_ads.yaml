name: "Roborock去广告"
description: "移除横幅、活动推广、机器人图标，精简服务中心。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Roborock.png"
mitm:
  hostnames:
    - "cniot.roborock.com"
    - "api.roborock.com"
http:
  rewrite:
    - "/^https:\\/\\/cniot\\.roborock\\.com\\/api\\/v1\\/activity\\/banner\\/list$/i":
        reject-dict: true
    - "/^https:\\/\\/cniot\\.roborock\\.com\\/api\\/v1\\/activity\\/latest$/i":
        reject-dict: true
    - "/^https:\\/\\/cniot\\.roborock\\.com\\/api\\/v1\\/app\\/theme\\/device\\/icon\\?/i":
        reject: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.roborock\\.com\\/v2\\/h5\\.page\\.item\\.info\\?id=4115$"
      filter: ".data |= map(select(.title == \"常用功能\"))"
