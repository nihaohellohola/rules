name: "皮皮虾去广告"
description: "移除开屏广告、评论区广告、视频流广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/PiPiXia.png"
mitm:
  hostnames:
    - "api.pipix.com"
    - "api5-lq.pipix.com"
http:
  rewrite:
    - "/^https:\\/\\/api(5-lq)?\\.pipix\\.com\\/api\\/ad\\//i":
        reject-dict: true
    - "/^https:\\/\\/api(5-lq)?\\.pipix\\.com\\/bds\\/banner\\//i":
        reject-dict: true
    - "/^https:\\/\\/api(5-lq)?\\.pipix\\.com\\/bds\\/feed\\/follow_feed\\//i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api(5-lq)?\\.pipix\\.com\\/bds\\/feed\\/stream\\/v2\\/"
      filter: ".data.data |= map(select(has(\"ad_info\") | not))"
  - response_jq:
      match: "^https:\\/\\/api(5-lq)?\\.pipix\\.com\\/bds\\/user\\/check_in\\/"
      filter: ".data.profile_entrances |= map(select(.title != \"放心借\" and .title != \"洋钱罐借款\")) | del(.data.pet_interface_message)"
