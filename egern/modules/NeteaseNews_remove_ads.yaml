name: "网易新闻去广告"
description: "移除开屏广告、置顶新闻、热搜列表和搜索栏填充词。"
author: "RuCu6[https://github.com/RuCu6]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/NeteaseNews.png"
mitm:
  hostnames:
    - "nex.163.com"
    - "interface.music.163.com"
    - "c.m.163.com"
    - "client.mail.163.com"
    - "g1.163.com"
    - "support.you.163.com"
    - "interface3?.music.163.com"
    - "gw.m.163.com"
scriptings:
  - http_response:
      name: "移除网易新闻广告"
      match: "/^https:\\/\\/nex\\.163\\.com\\/q/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/NeteaseNews/NeteaseNews_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除网易新闻广告"
      match: "/^https:\\/\\/gw\\.m\\.163\\.com\\/nc\\/api\\/v1\\/feed\\/dynamic\\/headline-list\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/NeteaseNews/NeteaseNews_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除网易新闻广告"
      match: "/^https:\\/\\/gw\\.m\\.163\\.com\\/nc\\/api\\/v1\\/search\\/hot-word/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/NeteaseNews/NeteaseNews_remove_ads.js"
      body_required: true
http:
  rewrite:
