name: "中国移动云盘去广告"
description: "移除中国移动云盘开屏广告及应用内广告，首页的多余卡片可滑到最底部自定义隐藏掉，插件对此不做处理。"
author: "RuCu6[https://github.com/RuCu6]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/mobileClouds.png"
mitm:
  hostnames:
    - "jzts.cmpassport.com"
    - "ad.mcloud.139.com"
scriptings:
  - http_response:
      name: "移除开屏广告"
      match: "^https:\\/\\/jzts\\.cmpassport\\.com\\/personalized\\/getPushContent"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/mobileClouds/mobileClouds_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除应用内广告"
      match: "^https:\\/\\/ad\\.mcloud\\.139\\.com\\/advertapi\\/adv-filter\\/"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/mobileClouds/mobileClouds_remove_ads.js"
      body_required: true
