name: "WakeUp课程表去广告"
description: "移除横幅广告、弹窗广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/WakeupSchedule.png"
mitm:
  hostnames:
    - "api.wakeup.fun"
http:
  rewrite:
    - "/^https:\\/\\/api\\.wakeup\\.fun\\/wakeup\\/app\\/bannerconf$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.wakeup\\.fun\\/wakeup\\/user\\/mine$"
      filter: "delpaths([[\"data\", \"bannerItems\"]])"
