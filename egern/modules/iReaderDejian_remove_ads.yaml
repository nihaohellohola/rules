name: "得间小说去广告"
description: "移除开屏广告、章末广告，移除扉页广告提示、听书界面广告提示、搜索栏填充词。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/iReaderDejian.png"
mitm:
  hostnames:
    - "dj.palmestore.com"
http:
  rewrite:
    - "/^https:\\/\\/dj\\.palmestore\\.com\\/djad\\//i":
        reject-dict: true
    - "/^https:\\/\\/dj\\.palmestore\\.com\\/zybk\\/api\\/ad\\//i":
        reject-dict: true
    - "/^https:\\/\\/dj\\.palmestore\\.com\\/zyapi\\/bookstore\\/ad\\//i":
        reject-dict: true
    - "/^https:\\/\\/dj\\.palmestore\\.com\\/zybk\\/api\\/bookshelf\\/index\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/dj\\.palmestore\\.com\\/zybk\\/api\\/powerup\\/userGroup\\?"
      filter: "delpaths([[\"body\", \"sevenDaysAd\"], [\"body\", \"shortPlayShow\"], [\"body\", \"sdkShortPlayAB\"]])"
  - response_jq:
      match: "^https:\\/\\/dj\\.palmestore\\.com\\/zybk\\/api\\/search\\/index\\?"
      filter: "delpaths([[\"body\", \"keywords\"]])"
