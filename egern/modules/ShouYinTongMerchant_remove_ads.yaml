name: "收银通商户端去广告"
description: "移除开屏广告和首页推广"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ShouYinTongMerchant.png"
mitm:
  hostnames:
    - "syt.leshuazf.com"
    - "m.fqfin.cn"
http:
  rewrite:
    - "/^https:\\/\\/syt\\.leshuazf\\.com\\/merchant\\/merchant\\/showOpenScreenAd$/i":
        reject-dict: true
    - "/^https:\\/\\/m\\.fqfin\\.cn\\/cls\\/leshuapay\\/preCredit\\.json$/i":
        reject-dict: true
    - "/^https:\\/\\/syt\\.leshuazf\\.com\\/merchant\\/messageCenter\\/stationLetterList$/i":
        reject-dict: true
    - "/^https:\\/\\/syt\\.leshuazf\\.com\\/merchant\\/merchant\\/getBannerConfig$/i":
        reject-dict: true
    - "/^https:\\/\\/syt\\.leshuazf\\.com\\/merchant\\/popup\\/getPopupInfo$/i":
        reject-dict: true
