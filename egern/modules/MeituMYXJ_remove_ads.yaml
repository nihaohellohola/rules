name: "美颜相机去广告"
description: "移除开屏广告、应用内弹窗，精简首页和我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeituMYXJ.png"
mitm:
  hostnames:
    - "api.meiyan.com"
scriptings:
  - http_response:
      name: "精简首页功能栏目并移除美颜推荐"
      match: "^https:\\/\\/api\\.meiyan\\.com\\/operation\\/home\\.json\\?"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/api\\.meiyan\\.com\\/operation\\/home_banner\\.json\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.meiyan\\.com\\/vip\\/permission_update_popup\\.json\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.meiyan\\.com\\/operation\\/get_config\\.json\\?"
      filter: "delpaths([[\"response\", \"time_limit\"], [\"response\", \"bubble\"], [\"response\", \"person_center\"]])"
  - response_jq:
      match: "^https:\\/\\/api\\.meiyan\\.com\\/operation\\/get_config\\.json\\?"
      filter: "setpath([\"response\", \"function_pop\", \"meiyan_style\", \"is_pop\"]; false) | setpath([\"response\", \"onoff\", \"vip_half_window_exit_remain_popup\", \"open\"]; 0) | setpath([\"response\", \"onoff\", \"vip_home_exit_remain_popup\"]; 0)"
