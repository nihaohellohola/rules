        reject-dict: true
    - "/^https:\\/\\/(webboot\\.zhangyue\\.com|ih2\\.ireader\\.com)\\/zyapi\\/bookstore\\/user\\/mytab\\?/i":
        reject-dict: true
    - "/^https:\\/\\/(webboot\\.zhangyue\\.com|ih2\\.ireader\\.com)\\/zyboot\\/activity\\/mytab\\?/i":
