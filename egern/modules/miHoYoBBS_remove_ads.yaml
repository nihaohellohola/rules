        reject-dict: true
    - "/^https:\\/\\/bbs-api(-ab)?\\.miyoushe\\.com\\/apihub\\/api\\/getHotKeywordAndEvent$/i":
        reject-dict: true
    - "/^https:\\/\\/bbs-api-static\\.miyoushe\\.com\\/search\\/api\\/search\\/pre_keyword\\?/i":
        reject-dict: true
