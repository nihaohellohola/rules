name: "米游社去广告"
description: "移除开屏广告、搜索栏热搜及资讯、青少年模式弹窗。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/miHoYoBBS.png"
mitm:
  hostnames:
    - "bbs-api.miyoushe.com"
    - "bbs-api-ab.miyoushe.com"
http:
  rewrite:
    - "/^https:\\/\\/bbs-api(-ab)?\\.miyoushe\\.com\\/apihub\\/api\\/getAppSplash$/i":
        reject-dict: true
    - "/^https:\\/\\/bbs-api(-ab)?\\.miyoushe\\.com\\/apihub\\/api\\/getHotKeywordAndEvent$/i":
        reject-dict: true
    - "/^https:\\/\\/bbs-api-static\\.miyoushe\\.com\\/search\\/api\\/search\\/pre_keyword\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/bbs-api(-ab)?\\.miyoushe\\.com\\/apihub\\/api\\/getAppStartupData$"
      filter: "delpaths([[\"data\", \"resp_map\", \"/teenager/api/info\"], [\"data\", \"resp_map[\\\"/apihub/api/getAppConfig\\\"]\", \"data\", \"get_app_config_response\", \"config\", \"is_show_teenager_mode_btn\"], [\"data\", \"resp_map[\\\"/apihub/api/getAppConfig\\\"]\", \"data\", \"get_app_config_response\", \"config\", \"teenager_popup_freq_type\"]])"
  - response_jq:
      match: "^https:\\/\\/bbs-api(-ab)?\\.miyoushe\\.com\\/apihub\\/api\\/getAppConfig$"
      filter: "setpath([\"data\", \"config\", \"teenager_popup_freq_type\"]; 0) | setpath([\"data\", \"config\", \"is_show_teenager_mode_btn\"]; 0)"
  - response_jq:
      match: "^https:\\/\\/bbs-api-ab\\.miyoushe\\.com\\/teenager\\/api\\/info$"
      filter: "setpath([\"data\", \"is_enabled\"]; false) | setpath([\"data\", \"is_teenager\"]; false) | setpath([\"data\", \"is_force\"]; false)"
