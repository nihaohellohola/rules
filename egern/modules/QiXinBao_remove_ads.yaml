name: "启信宝去广告"
description: "移除开屏广告、应用内弹窗、首页轮播图、悬浮部件和个性化推荐信息流。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/QiXinBao.png"
mitm:
  hostnames:
    - "appc.qixin.com"
    - "appc-v6.qixin.com"
    - "qxb-minicode-pic-osscache.qixin.com"
http:
  rewrite:
    - "/^https:\\/\\/appc\\.qixin\\.com\\/v4\\/general\\/getSearchPlaceholderRedirect$/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/general\\/getAppFloatAd$/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/general\\/getAppBanners$/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/user\\/getUserActivitys$/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/enterprise\\/homePageRecommend\\/recommendCard\\d+/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/user\\/getRecommendPersons$/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/enterprise\\/getRecommendEnts$/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/enterprise\\/getRecommendation$/i":
        reject-dict: true
    - "/^https:\\/\\/appc-v6\\.qixin\\.com\\/v4\\/general\\/getAppBottomBanners$/i":
        reject-dict: true
    - "/^https:\\/\\/qxb-minicode-pic-osscache\\.qixin\\.com\\/web\\//i":
        reject: true
