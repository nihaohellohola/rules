name: "网易云音乐去广告"
description: "过滤网易云音乐广告，并允许自定义界面。"
author: "RuCu6[https://github.com/RuCu6], Keywos[https://github.com/Keywos]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/NeteaseCloudMusic.png"
mitm:
  hostnames:
    - "interface*.music.163.com"
rules:
  - domain:
      match: "iadmat.nosdn.127.net"
      policy: REJECT
  - domain:
      match: "iadmatapk.nosdn.127.net"
      policy: REJECT
  - domain:
      match: "iadmusicmat.music.126.net"
      policy: REJECT
  - domain:
      match: "iadmusicmatvideo.music.126.net"
      policy: REJECT
  - domain:
      match: "ipv4.music.163.com"
      policy: REJECT
  - domain:
      match: "ipv6.music.163.com"
      policy: REJECT
scriptings:
  - http_response:
      name: "评论区、热推、有话想说、分享一下、歌曲下的祝福等小提示"
      match: "^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/(?:batch|v2\\/resource\\/comment\\/floor\\/get)"
      timeout: 20
      body_required: true
      binary_body: true
  - http_response:
      name: "推荐、home、主页"
      match: "^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/(?:homepage\\/block\\/page|link\\/page\\/rcmd\\/(?:block\\/resource\\/multi\\/refresh|resource\\/show))"
      timeout: 20
      body_required: true
      binary_body: true
      arguments:
        "_compat.$argument": "PRGG=false&PRRK=false&PRDRD=false&PRSCVPT=false&PRST=false&PRRR=false&HMPR=false&PRMST=false&PRCN=false"
  - http_response:
      name: "底部选项卡"
      match: "^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/link\\/home\\/framework\\/tab"
      timeout: 20
      body_required: true
      binary_body: true
      arguments:
        "_compat.$argument": "MY=false&DT=false&FX=false"
  - http_response:
      name: "发现页"
      match: "^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/link\\/page\\/discovery\\/resource\\/show"
      timeout: 20
      body_required: true
      binary_body: true
  - http_response:
      name: "我的页面"
      match: "^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/link\\/position\\/show\\/resource"
      timeout: 20
      body_required: true
      binary_body: true
  - http_response:
      name: "显示未关注你的人"
      match: "^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/user\\/follow\\/users\\/mixed\\/get"
      timeout: 20
      body_required: true
      binary_body: true
http:
  rewrite:
    - "/^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/(?:delivery\\/(batch-)?deliver|moment\\/tab\\/info\\/|side-bar\\/mini-program\\/music-service\\/account|yunbei\\/account\\/entrance\\/)/i":
        reject-dict: true
    - "/^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/(?:community\\/friends\\/fans-group\\/artist\\/group\\/|mine\\/applet\\/redpoint|music\\/songshare\\/text\\/recommend\\/|resniche\\/position\\/play\\/new\\/|resniche\\/tspopup\\/show|resource\\/comments?\\/musiciansaid\\/|user\\/sub\\/artist)/i":
        reject-dict: true
    - "/^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/eapi\\/(?:ios\\/version|mlivestream\\/entrance\\/playpage\\/|link\\/position\\/show\\/strategy|link\\/scene\\/show\\/resource|v1\\/content\\/exposure\\/comment\\/banner\\/)/i":
        reject-dict: true
    - "/^https?:\\/\\/interface\\d?\\.music\\.163\\.com\\/w?eapi\\/(?:activity\\/bonus\\/playpage\\/time\\/query|resource-exposure\\/|search\\/(?:chart\\/|rcmd\\/keyword\\/|specialkeyword\\/))/i":
        reject-dict: true
    - "/^https:\\/\\/interface\\d\\.music\\.163\\.com\\/eapi\\/my\\/podcast\\/tab\\/recommend/i":
        reject-dict: true
