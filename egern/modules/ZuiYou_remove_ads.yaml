name: "最右去广告"
description: "移除开屏广告、信息流广告和广告轮播图。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ZuiYou.png"
mitm:
  hostnames:
    - "api.izuiyou.com"
    - "zyfile.izuiyou.com"
http:
  rewrite:
    - "/^https?:\\/\\/api\\.izuiyou\\.com\\/config\\/get_banner/i":
        reject-dict: true
    - "/^https?:\\/\\/api\\.izuiyou\\.com\\/ad\\//i":
        reject: true
    - "/^https:\\/\\/zyfile\\.izuiyou\\.com\\/zyfile\\/c2\\/a0\\/[a-z0-9-]+\\.json/i":
        reject-dict: true
