name: "KOOK去广告"
description: "移除开屏广告、房间横幅推广、促销活动、精简发现页面频道及我的页面，移除底栏商城入口。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/KOOK.png"
mitm:
  hostnames:
    - "m.kookapp.cn"
    - "www.kookapp.cn"
http:
  rewrite:
    - "/^https:\\/\\/www\\.kookapp\\.cn\\/api\\/v3\\/ad\\/config$/i":
        reject-dict: true
    - "/^https:\\/\\/www\\.kookapp\\.cn\\/api\\/v3\\/promotion\\/ongoing$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/(m|www)\\.kookapp\\.cn\\/api\\/v\\d\\/user\\/settings$"
      filter: "delpaths([[\"ad_banner\"], [\"advertise_on_off\"]])"
  - response_jq:
      match: "^https:\\/\\/(m|www)\\.kookapp\\.cn\\/api\\/v\\d\\/user\\/settings$"
      filter: "setpath([\"ios_mall_switch\"]; false)"
  - response_jq:
      match: "^https:\\/\\/www\\.kookapp\\.cn\\/api\\/v3\\/discover\\/tab-list\\?"
      filter: ".data.items |= map(select(.id == 472 or .id == 473 or .id == 475))"
