name: "最美壁纸去广告"
description: "移除悬浮广告、横幅广告、轮播图广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/iWallBiZhi.png"
mitm:
  hostnames:
    - "api.fzxhmy.com"
scriptings:
  - http_response:
      name: "移除首页广告配置"
      match: "^https:\\/\\/api\\.fzxhmy\\.com\\/core\\/initialize\\?"
      body_required: true
  - http_response:
      name: "移除首页轮播图广告"
      match: "^https:\\/\\/api\\.fzxhmy\\.com\\/landing\\/initialize\\?"
      body_required: true
  - http_response:
      name: "移除头像页横幅跳转"
      match: "^https:\\/\\/api\\.fzxhmy\\.com\\/avatar\\/landing\\?"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/api\\.fzxhmy\\.com\\/seek\\/trendingword\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.fzxhmy\\.com\\/tone\\/trending\\?/i":
        reject-dict: true
