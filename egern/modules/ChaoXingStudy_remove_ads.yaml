name: "学习通去广告"
description: "移除开屏广告、横幅推广，精简校园补给站频道。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ChaoXingStudy.png"
mitm:
  hostnames:
    - "learn.chaoxing.com"
    - "home-yd.chaoxing.com"
    - "apps.chaoxing.com"
    - "groupyd2.chaoxing.com"
    - "appswh.chaoxing.com"
http:
  rewrite:
    - "/^https:\\/\\/home-yd\\.chaoxing\\.com\\/apis\\/data\\/getAdsRecommend\\?/i":
        reject-dict: true
    - "/^https:\\/\\/home-yd\\.chaoxing\\.com\\/apis\\/banner\\/getConfigInfoForXsqy\\?/i":
        reject-dict: true
    - "/^https:\\/\\/groupyd2\\.chaoxing\\.com\\/apis\\/activity\\/getActivitys_attention\\?/i":
        reject-dict: true
    - "/^https:\\/\\/appswh\\.chaoxing\\.com\\/apis\\/activity\\/getNoteTopicList\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/learn\\.chaoxing\\.com\\/apis\\/service\\/appConfig\\?"
      filter: "delpaths([[\"data\", \"ad\"]])"
  - response_jq:
      match: "^https:\\/\\/apps\\.chaoxing\\.com\\/apis\\/home\\/getHpXsqy\\.jspx\\?"
      filter: ".data.list |= map(select(.pid == 4 or .pid == 44)) | .data.list_xsqy |= map(select(.pid == 4 or .pid == 44)) | .data.list_xysqbj |= map(select(.pid == 4 or .pid == 44)) | .data.lanmu |= map(select(.id == 4 or .id == 44))"
  - response_jq:
      match: "^https:\\/\\/apps\\.chaoxing\\.com\\/apis\\/home\\/getHpXsqy\\.jspx\\?"
      filter: "delpaths([[\"data\", \"list_timeapp\"]])"
