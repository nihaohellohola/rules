name: "CC直播去广告"
description: "移除信息流推广和横幅，精简顶部标签。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/CCLive.png"
mitm:
  hostnames:
    - "api.cc.163.com"
    - "cc.163.com"
    - "mshare.cc.163.com"
    - "appapi.cc.163.com"
http:
  rewrite:
    - "/^https:\\/\\/cc\\.163\\.com\\/act\\/m\\/daily\\/ad_/i":
        reject: true
    - "/^http:\\/\\/mshare\\.cc\\.163\\.com\\/mshare\\/startadv_mobile_v\\d\\?/i":
        reject-dict: true
    - "/^https:\\/\\/appapi\\.cc\\.163\\.com\\/v\\d\\/mixfloatingwindow\\/floating_windows\\?/i":
        reject-dict: true
    - "/^http:\\/\\/api\\.cc\\.163\\.com\\/v1\\/mpopuprecommend\\/exit_room_conf$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.cc\\.163\\.com\\/v\\d\\/mgamenavigation\\/navigation_list\\?"
      filter: ".data.info_list |= map(select(.name == \"关注\" or .name == \"推荐\" or .name == \"视频\" or .name == \"全部\"))"
  - response_jq:
      match: "^https:\\/\\/api\\.cc\\.163\\.com\\/v\\d\\/mgamerecpage\\/recommend_page\\?"
      filter: ".data.plugins|=map(select(.module_type!=\"banner\"))|.data.plugins|=map(select(.module_type!=\"show_list\"))|.data.plugins|=map(select(.title!=\"推荐品类\"))"
  - response_jq:
      match: "^https:\\/\\/api\\.cc\\.163\\.com\\/v\\d\\/entpage\\/live_navbar_mobile\\/ios\\?"
      filter: ".data.top_nav |= map(select(.cn_name == \"推荐\" or .cn_name == \"星秀\" or .cn_name == \"心动交友\"))"
