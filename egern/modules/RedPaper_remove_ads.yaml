name: "小红书去广告"
description: "过滤信息流推广，移除图片及视频水印，如有异常，请先清除缓存再尝试。"
author: "RuCu6[https://github.com/RuCu6], fmz200[https://github.com/fmz200]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/RedPaper.png"
mitm:
  hostnames:
    - "ci.xiaohongshu.com"
    - "edith.xiaohongshu.com"
    - "rec.xiaohongshu.com"
    - "so.xiaohongshu.com"
    - "www.xiaohongshu.com"
scriptings:
  - http_response:
      name: "移除图片和实况照片水印"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v1\\/note\\/(?:imagefeed|live_photo\\/save)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除整体配置 ui"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v1\\/system\\/service\\/ui\\/config\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除开屏广告 config"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v1\\/system_service\\/config\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除开屏广告 splash_config"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v2\\/system_service\\/splash_config/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除详情页小部件、关注页感兴趣的人"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v2\\/(?:note\\/widgets|user\\/followings\\/followfeed)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除信息流广告"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v4\\/followfeed\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除详情页感兴趣的人"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v5\\/recommend\\/user\\/follow_recommend\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除评论区实况照片水印"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/(?:v1\\/interaction\\/comment\\/video\\/download|v5\\/note\\/comment\\/list)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除图片和视频水印"
      match: "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/(?:v2\\/note\\/feed|v3\\/note\\/videofeed)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除信息流广告"
      match: "/^https:\\/\\/(?:edith|rec)\\.xiaohongshu\\.com\\/api\\/sns\\/v6\\/homefeed\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除搜索页广告"
      match: "/^https:\\/\\/(?:edith|so)\\.xiaohongshu\\.com\\/api\\/sns\\/v10\\/search\\/notes\\?/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
  - http_response:
      name: "移除视频水印"
      match: "/^https:\\/\\/(?:edith|rec|www)\\.xiaohongshu\\.com\\/api\\/sns\\/(?:v4\\/note\\/videofeed|v10\\/note\\/video\\/save)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/RedPaper/RedPaper_remove_ads.js"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/ci\\.xiaohongshu\\.com\\/system_config\\/watermark/i":
        reject-img: true
    - "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/v1\\/surprisebox\\/(?:get_style|open|submit_action)/i":
        reject-dict: true
    - "/^https:\\/\\/www\\.xiaohongshu\\.com\\/api\\/marketing\\/box\\/trigger\\?/i":
        reject-dict: true
    - "/^https:\\/\\/edith\\.xiaohongshu\\.com\\/api\\/sns\\/(?:v2\\/guide\\/user_banner|v3\\/note\\/guide)/i":
        reject-dict: true
    - "/^https:\\/\\/www\\.xiaohongshu\\.com\\/api\\/sns\\/(?:v1\\/ads\\/resource|v2\\/hey\\/\\w+\\/hey_gallery)/i":
        reject-dict: true
