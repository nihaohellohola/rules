name: "口袋壁纸去广告"
description: "移除悬浮广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ShoujiDesk.png"
mitm:
  hostnames:
    - "api.tdz5.com"
scriptings:
  - http_response:
      name: "移除首页广告配置"
      match: "^https:\\/\\/api\\.tdz5\\.com\\/base\\/init\\?"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/api\\.tdz5\\.com\\/search\\/hotword\\?/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.tdz5\\.com\\/ring\\/hot\\?/i":
        reject-dict: true
