name: "淘票票去广告"
description: "移除开屏广告、悬浮广告、轮播图广告和弹窗广告，移除搜索填充词和为你推荐。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Taopiaopiao.png"
mitm:
  hostnames:
    - "acs.m.taobao.com"
http:
  rewrite:
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.film\\.life\\.popup\\.get\\//i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.film\\.mtopindependentadvertiseapi\\.queryadvertise\\//i":
        reject-dict: true
    - "/^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.film\\.mtopitemadvertiseapi\\.queryadvertise\\//i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.film\\.mtopintegrationapi\\.homeconfig\\/"
      filter: "delpaths([[\"data\", \"returnValue\", \"floatingBanner\"], [\"data\", \"returnValue\", \"searchShadeList\"]])"
  - response_jq:
      match: "^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.film\\.mtopintegrationapi\\.homeconfig\\/"
      filter: ".data.returnValue.topTab |= map(select(.activeImage | not)) | .data.returnValue.topTab |= map(del(.backgroundColor))"
  - response_jq:
      match: "^https:\\/\\/acs\\.m\\.taobao\\.com\\/gw\\/mtop\\.film\\.life\\.aristotle\\.get\\/"
      filter: "def filter_nodes: map(if .data.componentId? and (.data.componentId | type == \"string\") and (.data.componentId | (contains(\"tpp_banner\") or . == \"tpp_guess_like\")) then empty else .nodes |= (if . then filter_nodes else . end) end); .data.nodes |= (if . then filter_nodes else . end)"
