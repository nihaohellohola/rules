name: "纷玩岛去广告"
description: "移除开屏广告、弹窗广告、信息横幅推广、票夹页面横幅广告。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/LiveLab.png"
mitm:
  hostnames:
    - "api.livelab.com.cn"
http:
  rewrite:
    - "/^https:\\/\\/api\\.livelab\\.com\\.cn\\/pgc\\/advert\\//i":
        reject-dict: true
    - "/^https:\\/\\/api\\.livelab\\.com\\.cn\\/search\\/appHotWords\\/app\\/queryHotWords$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.livelab\\.com\\.cn\\/appShow\\/hotSearch\\/app\\/rankList$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.livelab\\.com\\.cn\\/appShow\\/app\\/homepage\\/banners\\?bannerModuleId=(82|84|53)/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.livelab\\.com\\.cn\\/appShow\\/app\\/homepage\\/modules\\?tabId=5$"
      filter: ".data |= map(select(.id | IN(51, 52, 81, 82, 83, 84)))"
