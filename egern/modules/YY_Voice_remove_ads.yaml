name: "YY去广告"
description: "移除开屏广告、应用内弹窗，精简底栏和我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YY_Voice.png"
mitm:
  hostnames:
    - "yyapp-act-entrance.yy.com"
    - "yyapp-fastnet.yy.com"
    - "personal-center.yy.com"
    - "tab.yy.com"
    - "data.3g.yy.com"
    - "yyapp-idx.yy.com"
http:
  rewrite:
    - "/^https:\\/\\/yyapp-fastnet\\.yy\\.com\\/dispatch\\?/i":
        reject-dict: true
    - "/^https:\\/\\/data\\.3g\\.yy\\.com\\/popup\\/topLiveCardPopup\\?/i":
        reject-dict: true
    - "/^https:\\/\\/yyapp-act-entrance\\.yy\\.com\\/entrance\\/list\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/yyapp-idx\\.yy\\.com\\/mobyy\\/nav\\/index\\/idx\\?"
      filter: ".data[].modules |= map(select(.name != \"新版本滚动条\" and .name != \"通栏轮播\" and .name != \"新静默位\"))"
  - response_jq:
      match: "^https:\\/\\/tab\\.yy\\.com\\/tabs\\?"
      filter: "delpaths([[\"data\", \"tabsForSelect\"]])"
  - response_jq:
      match: "^https:\\/\\/tab\\.yy\\.com\\/tabs\\?"
      filter: ".data.tabs |= map(select(.alias == \"follow\" or .alias == \"im\" or .alias == \"me\"))"
  - response_jq:
      match: "^https:\\/\\/personal-center\\.yy\\.com\\/personalCenter\\/list\\?"
      filter: ".data.modules |= map(select(.moduleName != \"Banner轮播\")) | .data.modules |= map(if has(\"entrances\") then .entrances |= map(select(.bizCode|IN(\"jishijiedaikuan\",\"duxiaoman2\",\"chongzhi\",\"freeData\")|not)) else . end)"
