name: "豆瓣阅读去广告"
description: "移除开屏广告、弹窗广告、热门搜索、热搜榜。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DoubanRead.png"
mitm:
  hostnames:
    - "read.douban.com"
http:
  rewrite:
    - "/^https:\\/\\/read\\.douban\\.com\\/api\\/v2\\/ads\\//i":
        reject-dict: true
    - "/^https:\\/\\/read\\.douban\\.com\\/api\\/v2\\/popup$/i":
        reject-dict: true
    - "/^https:\\/\\/read\\.douban\\.com\\/api\\/v2\\/search\\/hot_words$/i":
        reject-dict: true
    - "/^https:\\/\\/read\\.douban\\.com\\/api\\/v2\\/search\\/hot_charts$/i":
        reject-dict: true
    - "/^https:\\/\\/read\\.douban\\.com\\/api\\/v2\\/search\\/rec_urls$/i":
        reject-dict: true
