name: "Fileball网盘挂载"
description: "支持挂载阿里云盘、夸克网盘和PikPak网盘，点击下方署名查看使用方法。"
author: "小白脸"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Fileball.png"
mitm:
  hostnames:
    - "aliyun.example.com"
    - "quark.example.com"
    - "pikpak.example.com"
scriptings:
  - http_request:
      name: "三合一网盘挂载"
      match: "/^http:\\/\\/(aliyun|quark|pikpak)\\.example\\.com/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/Fileball/Fileball_mount.js"
      body_required: true
