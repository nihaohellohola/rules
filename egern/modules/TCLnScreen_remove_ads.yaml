name: "多屏互动去广告"
description: "移除开屏广告、横幅推广、搜索填充词，移除广告下发。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/TCLnScreen.png"
mitm:
  hostnames:
    - "tcast-o.api.leiniao.com"
http:
  rewrite:
    - "/^https:\\/\\/tcast-o\\.api\\.leiniao\\.com\\/tcast\\/ads\\//i":
        reject-dict: true
    - "/^https:\\/\\/tcast-o\\.api\\.leiniao\\.com\\/tcast\\/v\\d\\/selection\\/banner$/i":
        reject-dict: true
    - "/^https:\\/\\/tcast-o\\.api\\.leiniao\\.com\\/tcast\\/v\\d\\/searchrank$/i":
        reject-dict: true
    - "/^https:\\/\\/tcast-o\\.api\\.leiniao\\.com\\/tcast\\/v\\d\\/selection\\?/i":
        reject-dict: true
    - "/^https:\\/\\/tcast-o\\.api\\.leiniao\\.com\\/tcast\\/message\\/v\\d\\/activity\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/tcast-o\\.api\\.leiniao\\.com\\/tcast\\/v\\d\\/config\\/function\\?"
      filter: ".data |= map(select(.module == \"tools\"))"
