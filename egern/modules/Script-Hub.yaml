name: "Script-Hub"
description: "将其他工具的Rewrite、Rule和JavaScript资源转换为Loon能识别的格式，使用前请在本插件的详情页面为[PROXY]项分配代理策略。在插件列表中点击此插件上的链接查看使用方法。"
author: "xream[https://github.com/xream], Keywos[https://github.com/Keywos], CKYB[https://github.com/CKYB], 小白脸"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/Other_icon/120px/Script-Hub.png"
mitm:
  hostnames:
    - "script.hub"
    - "*.script.hub"
scriptings:
  - http_request:
      name: "前端界面"
      match: "/^https?:\\/\\/script\\.hub\\/($|edit\\/|reload)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/script-hub.js"
  - http_request:
      name: "Rewrite转换"
      match: "/^https?:\\/\\/script\\.hub\\/file\\/_start_\\/.+type=(?:qx-rewrite|surge-module|loon-plugin|all-module)/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/Rewrite-Parser.js"
  - http_request:
      name: "Rule转换"
      match: "/^https?:\\/\\/script\\.hub\\/file\\/_start_\\/.+type=rule-set/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/rule-parser.js"
  - http_request:
      name: "JavaScript转换"
      match: "/^https?:\\/\\/script\\.hub\\/convert\\//i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/script-converter.js"
