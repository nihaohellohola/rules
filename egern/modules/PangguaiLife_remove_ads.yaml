name: "胖乖生活去广告"
description: "移除开屏广告、横幅轮播图、网格广告、信息流广告、浮窗广告，精简我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/PangguaiLife.png"
mitm:
  hostnames:
    - "userapi.qiekj.com"
http:
  rewrite:
    - "/^https:\\/\\/userapi\\.qiekj\\.com\\/slot\\/get$/i":
        reject-dict: true
    - "/^https:\\/\\/userapi\\.qiekj\\.com\\/appTitle\\/get$/i":
        reject-dict: true
    - "/^https:\\/\\/userapi\\.qiekj\\.com\\/integralRecord\\/integralDailStatistics$/i":
        reject-dict: true
    - "/^https:\\/\\/userapi\\.qiekj\\.com\\/local-life\\/category$/i":
        reject-dict: true
    - "/^https:\\/\\/userapi\\.qiekj\\.com\\/integralGoods\\/queryIntegralGoodsPage$/i":
        reject-dict: true
    - "/^https:\\/\\/userapi\\.qiekj\\.com\\/task\\/list$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/userapi\\.qiekj\\.com\\/local-life\\/tab-order$"
      filter: "setpath([\"data\"]; \"[]\")"
  - response_jq:
      match: "^https:\\/\\/userapi\\.qiekj\\.com\\/integralGoods\\/queryIntegralGoodsCategoryList$"
      filter: "setpath([\"data\"]; \"[]\")"
