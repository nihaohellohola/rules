name: "YY语音去广告"
description: "移除开屏广告、应用内弹窗、任务推广、频道横幅推广，精简广场顶部标签。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YYVoiceTool.png"
mitm:
  hostnames:
    - "yuyin-api.baizhanlive.com"
    - "web.yy.com"
http:
  rewrite:
    - "/^https:\\/\\/yuyin-api\\.baizhanlive\\.com\\/homepage\\/flashscreen\\/get\\?/i":
        reject-dict: true
    - "/^https:\\/\\/yuyin-api\\.baizhanlive\\.com\\/homepage\\/homepage\\/banner\\?/i":
        reject-dict: true
    - "/^https:\\/\\/web\\.yy\\.com\\/yyvoice_task_sys\\/bar\\.html\\?/i":
        reject: true
    - "/^https:\\/\\/yuyin-api\\.baizhanlive\\.com\\/search\\/search\\/hotword\\?/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/yuyin-api\\.baizhanlive\\.com\\/postsquare\\/college\\/page\\/tabsV3\\?"
      filter: ".data.tabList |= map(select(.code == \"post\" or .code == \"teamup\" or .code == \"college\" or .code == \"aiSecretRoom\"))"
