name: "比心去广告"
description: "移除弹窗广告、悬浮广告、横幅广告、轮播图广告，精简搜索页及我的页面。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Bixin.png"
mitm:
  hostnames:
    - "web.hibixin.com"
    - "api.hibixin.com"
    - "gateway.hibixin.com"
    - "gateway.xxqapp.cn"
    - "api.xxqapp.cn"
    - "web-bxyuer.bixin.cn"
    - "gateway.bxyuer.com"
scriptings:
  - http_response:
      name: "精简首页标签"
      match: "^https:\\/\\/gateway\\.hibixin\\.com\\/resource\\/v\\d\\/common\\/tab\\/query$"
      body_required: true
  - http_response:
      name: "精简我的页面"
      match: "^https:\\/\\/gateway\\.hibixin\\.com\\/resource\\/v\\d\\/my\\/page$"
      body_required: true
http:
  rewrite:
    - "/^https:\\/\\/web\\.hibixin\\.com\\/user-recall\\/signModal$/i":
        reject: true
    - "/^https:\\/\\/api\\.hibixin\\.com\\/config\\/v\\d\\/common\\/popup$/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.hibixin\\.com\\/resource\\/v\\d\\/rec\\/card\\/query$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.hibixin\\.com\\/msg\\/user\\/friends\\/trends\\/top$/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.xxqapp\\.cn\\/live\\/pendant\\/index\\/items$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.xxqapp\\.cn\\/banner\\/list\\/\\d$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.hibixin\\.com\\/resource\\/v\\d\\/discovery\\/entrance\\/activity$/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.hibixin\\.com\\/config\\/search\\/qryConfigPart$/i":
        reject-dict: true
    - "/^https:\\/\\/gateway\\.xxqapp\\.cn\\/live\\/flow\\/pendant\\/meta$/i":
        reject-dict: true
    - "/^https:\\/\\/web-bxyuer\\.bixin\\.cn\\/yuer-ads\\?/i":
        reject: true
    - "/^https:\\/\\/gateway\\.bxyuer\\.com\\/official\\/room\\/tab\\/pop$/i":
        reject-dict: true
    - "/^https:\\/\\/api\\.hibixin\\.com\\/biggie\\/query\\/skill\\/detail\\/relateRecommendBiggieV\\d$/i":
        reject-dict: true
body_rewrites:
  - response_jq:
      match: "^https:\\/\\/api\\.hibixin\\.com\\/biggie\\/home\\/v\\d\\/query\\/biggie$"
      filter: ".result.list |= map(select(has(\"bannerList\") and .bannerList == null))"
  - response_jq:
      match: "^https:\\/\\/api\\.hibixin\\.com\\/resource\\/v\\d\\/common\\/tab$"
      filter: ".result |= map(select(.type != \"activityCenter\"))"
