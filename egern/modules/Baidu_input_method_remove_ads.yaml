name: "百度输入法去广告"
description: "过滤百度输入法广告，替换个人主页随机图。"
author: "Keywos[https://github.com/Keywos]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Baidu_input_method.png"
mitm:
  hostnames:
    - "imeres.baidu.com"
    - "mbd.baidu.com"
    - "mime.baidu.com"
scriptings:
  - http_response:
      name: "百度输入法去广告"
      match: "/^https?:\\/\\/mime\\.baidu\\.com\\/(imrobot\\/v1\\/pub\\/relation\\/get_robot_list|v5\\/custom_page\\/(layout|getdata))/i"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/Baidu_input_method/Baidu_input_method_remove_ads.js"
      body_required: true
http:
  rewrite:
    - "/^https?:\\/\\/mime\\.baidu\\.com\\/v5\\/start_screen_ads\\/list/i":
        reject-dict: true
    - "/^https?:\\/\\/mime\\.baidu\\.com\\/sapi\\/v1\\/lccorpus\\/(applist|pannellist)/i":
        reject-dict: true
    - "/^https?:\\/\\/mime\\.baidu\\.com\\/sapi\\/v1\\/(circle\\/joinedlist|lccorpus\\/usercorpussync|aihelpactivity\\/aihelpresource)/i":
        reject-dict: true
    - "/^https?:\\/\\/mime\\.baidu\\.com\\/commer\\/pocket_api\\/enterprise_list/i":
        reject-dict: true
    - "/^https?:\\/\\/mbd\\.baidu\\.com\\/ccs\\/v1\\/start\\/confsync\\?appname=baidu_input/i":
        reject-dict: true
    - "/^https:\\/\\/mime\\.baidu\\.com\\/v5\\/(fb\\/st\\?logtype|(notiv3|cellloc_noti|noti_cloudswitch_noti)\\/info)/i":
        reject-dict: true
