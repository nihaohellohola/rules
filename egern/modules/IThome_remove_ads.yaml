name: "IT之家去广告"
description: "过滤IT之家信息流广告和文末广告，自定义移除置顶和轮播图，自定义移除项需在插件配置。"
author: "可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/IThome.png"
mitm:
  hostnames:
    - "napi.ithome.com"
    - "api.zuihuimai.com"
    - "dat.ruanmei.com"
scriptings:
  - http_response:
      name: "IT之家去广告"
      match: "^https:\\/\\/napi\\.ithome\\.com\\/api\\/(news\\/indexv2\\/iphone\\/\\d+|topmenu\\/getfeeds\\?)"
      script_url: "https://raw.githubusercontent.com/fkingikelee/fkikelee/main/Resource/kelee/JavaScript/IThome/IThome_remove_ads.js"
      body_required: true
      arguments:
        "_compat.$argument": "removeAllBanners=false&removePinnedArticles=false"
http:
  rewrite:
    - "/^https?:\\/\\/dat\\.ruanmei\\.com\\/ithome\\/money\\/acd\\.json$/i":
        reject: true
