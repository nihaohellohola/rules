name: Convert AI rules for Loon

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Convert source YAML to Loon list
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          source_url = "https://ddgksf2013.top/filter/Ai.yaml"
          output_path = Path("loon/moyu_ai.list")

          request = urllib.request.Request(
              source_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              source = response.read().decode("utf-8")

          lines = source.splitlines()
          try:
              payload_index = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == "payload:"
              )
          except StopIteration:
              raise SystemExit("Source YAML has no payload: section")

          result = []
          rules = 0
          rule_pattern = re.compile(
              r"^(DOMAIN|DOMAIN-SUFFIX),[A-Za-z0-9*._-]+$"
          )

          for raw in lines[payload_index + 1:]:
              item = raw.strip()
              if not item:
                  if result and result[-1] != "":
                      result.append("")
                  continue
              if item.startswith("#"):
                  result.append(item)
                  continue
              if item.startswith("- "):
                  item = item[2:].strip()
              if not rule_pattern.fullmatch(item):
                  raise SystemExit(f"Unsupported payload line: {raw}")
              result.append(item)
              rules += 1

          while result and result[-1] == "":
              result.pop()
          if rules == 0:
              raise SystemExit("No supported rules found; refusing to overwrite output")

          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text("\\n".join(result) + "\\n", encoding="utf-8")
          print(f"Wrote {rules} rules to {output_path}")
          PY

      - name: Commit updated rules if changed
        run: |
          if git diff --quiet -- loon/moyu_ai.list; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loon/moyu_ai.list
          git commit -m "chore: update Loon AI rules"
          git push
