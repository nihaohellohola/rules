name: Convert AI rules for Egern and sync Clash source

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch, validate, and generate AI rule files
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          source_url = "https://ddgksf2013.top/filter/Ai.yaml"
          request = urllib.request.Request(source_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read().decode("utf-8")
          lines = raw.splitlines()
          payload_index = next((i for i, line in enumerate(lines) if line.strip() == "payload:"), None)
          if payload_index is None:
              raise SystemExit("Source YAML has no payload: section")
          rule_pattern = re.compile(r"^(DOMAIN|DOMAIN-SUFFIX),([A-Za-z0-9*._-]+)$")
          copilot_header = "# > Microsoft Copilot"
          copilot_start = next((i for i, line in enumerate(lines) if line.strip() == copilot_header), None)
          if copilot_start is None or copilot_start <= payload_index:
              raise SystemExit("Source YAML has no Microsoft Copilot section")
          copilot_end = next((i for i in range(copilot_start + 1, len(lines)) if lines[i].strip().startswith("# > ")), len(lines))

          def parse_rule(raw_line):
              item = raw_line.strip()
              if item.startswith("- "):
                  item = item[2:].strip()
              match = rule_pattern.fullmatch(item)
              if not match:
                  raise SystemExit(f"Unsupported payload line: {raw_line}")
              return match.group(1), match.group(2)

          def to_egern(raw_rules):
              groups = {"domain_set": [], "domain_suffix_set": []}
              for line in raw_rules:
                  kind, value = parse_rule(line)
                  groups["domain_set" if kind == "DOMAIN" else "domain_suffix_set"].append(value)
              output = []
              for key, values in groups.items():
                  if values:
                      output.append(key + ":")
                      output.extend("  - " + value for value in values)
              if not output:
                  raise SystemExit("No supported rules found")
              return "\n".join(output) + "\n"

          copilot_rules = [line for line in lines[copilot_start + 1:copilot_end] if line.strip() and not line.strip().startswith("#")]
          retained = lines[:copilot_start] + lines[copilot_end:]
          ai_rules = [line for line in retained[payload_index + 1:] if line.strip() and not line.strip().startswith("#")]
          ai_yaml = to_egern(ai_rules)
          copilot_yaml = to_egern(copilot_rules)
          clash_lines = retained[:payload_index + 1]
          clash_lines.extend("  - " + line.strip().removeprefix("- ").strip() if line.strip() and not line.strip().startswith("#") else line for line in retained[payload_index + 1:])
          Path("clash").mkdir(parents=True, exist_ok=True)
          Path("egern").mkdir(parents=True, exist_ok=True)
          Path("clash/moyu_ai.yaml").write_text("\n".join(clash_lines).rstrip() + "\n", encoding="utf-8")
          Path("clash/copilot.yaml").write_text("payload:\n# > Microsoft Copilot\n" + "".join("  - " + line.strip().removeprefix("- ").strip() + "\n" for line in copilot_rules), encoding="utf-8")
          Path("egern/moyu_ai.yaml").write_text(ai_yaml, encoding="utf-8")
          Path("egern/copilot.yaml").write_text(copilot_yaml, encoding="utf-8")
          try:
              import yaml
          except ImportError:
              raise SystemExit("PyYAML is required to validate generated Egern YAML")
          for path in (Path("egern/moyu_ai.yaml"), Path("egern/copilot.yaml")):
              parsed = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(parsed, dict) or not parsed:
                  raise SystemExit(f"Invalid or empty Egern YAML: {path}")
              print(f"Validated {path}")
          PY
      - name: Commit and push outputs if changed
        run: |
          files="clash/moyu_ai.yaml clash/copilot.yaml egern/moyu_ai.yaml egern/copilot.yaml"
          if git diff --quiet -- $files; then
            echo "Generated rule files did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "chore: update AI rules for Egern"
          git push
