name: Convert Clash custom rules to Egern

on:
  push:
    paths:
      - "clash/*.yaml"
      - "scripts/convert_cust_rules.py"
      - ".github/workflows/convert_cust_rules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Convert custom rules
        run: python3 scripts/convert_cust_rules.py
      - name: Commit generated Egern rules if changed
        run: |
          if git diff --quiet -- egern/; then
            echo "No generated Egern rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egern/
          git commit -m "chore: update Egern custom rules"
          git push
