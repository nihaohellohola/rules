name: Convert Clash custom rules to Egern

on:
  push:
    paths:
      - "clash/*.yaml"
      - "scripts/convert_cust_rules.py"
      - ".github/workflows/convert_cust_rules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install YAML validator
        run: python -m pip install PyYAML
      - name: Convert and validate custom rules
        run: |
          python3 scripts/convert_cust_rules.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          expected = {"ai_cust", "bd_ad_remove", "direct_cust", "direct_ip_cust", "google_cust", "onedrive_web", "proxy_cust", "reject_cust", "telegram_cust"}
          for stem in sorted(expected):
              path = Path("egern") / f"{stem}.yaml"
              if not path.exists():
                  if stem == "reject_cust":
                      continue
                  raise SystemExit(f"Missing generated file: {path}")
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not data:
                  raise SystemExit(f"Invalid/empty YAML mapping: {path}")
              print(f"Validated {path}")
          PY
      - name: Commit generated Egern rules if changed
        run: |
          if git diff --quiet -- egern/; then
            echo "No generated Egern rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egern/
          git commit -m "chore: update Egern custom rules"
          git push
