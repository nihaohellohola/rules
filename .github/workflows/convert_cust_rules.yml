name: Convert Clash custom rules to Loon

on:
  push:
    paths:
      - "clash/*cust*.yaml"
      - "clash/bd_ad_remove.yaml"
      - "clash/onedrive_web.yaml"
      - "scripts/convert_cust_rules.py"
      - ".github/workflows/convert_cust_rules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Convert custom rules
        run: python3 scripts/convert_cust_rules.py

      - name: Commit generated lists if changed
        run: |
          if git diff --quiet -- loon/ai_cust.list loon/bd_ad_remove.list loon/direct_cust.list loon/direct_ip_cust.list loon/google_cust.list loon/onedrive_web.list loon/proxy_cust.list loon/telegram_cust.list; then
            echo "No generated Loon rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loon/ai_cust.list loon/bd_ad_remove.list loon/direct_cust.list loon/direct_ip_cust.list loon/google_cust.list loon/onedrive_web.list loon/proxy_cust.list loon/telegram_cust.list
          git commit -m "chore: update Loon custom rules"
          git push
