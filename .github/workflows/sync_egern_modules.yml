name: Sync upstream Loon plugins to Egern modules

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install YAML validator
        run: python -m pip install PyYAML
      - name: Convert and validate modules
        run: |
          python3 scripts/convert_lpx_to_egern.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path("egern/modules").glob("*.yaml"):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              keys = ("rules", "scriptings", "http", "body_rewrites", "header_rewrites", "url_rewrites", "map_locals", "mitm")
              if not isinstance(data, dict) or not any(data.get(k) for k in keys):
                  raise SystemExit(f"Invalid Egern module: {path}")
              print(f"Validated {path}")
          PY
      - name: Commit and push generated modules
        run: |
          if git diff --quiet -- egern/modules/; then
            echo "Generated modules did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add egern/modules/
          git commit -m "chore: sync Egern modules from Loon plugins"
          git push
