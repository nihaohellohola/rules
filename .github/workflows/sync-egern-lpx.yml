name: Sync upstream LPX to Egern
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'scripts/convert_lpx_to_egern.py'
jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and convert all upstream LPX plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/convert_lpx_to_egern.py
      - name: Commit converted modules
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add egern/modules scripts/egern_lpx_sources.json
          git diff --cached --quiet || (git commit -m 'Sync converted upstream LPX modules' && git push)
